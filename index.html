<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Ayalga Quick Trade</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
        }

        .box {
            background: #222222;
            border-radius: 12px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
        }

        .version {
            font-size: 12px;
            color: #aaaaaa;
            background: #333333;
            padding: 6px 9px;
            border-radius: 6px;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .log {
            background: #000000;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>

<div class="box">

    <div class="header">

        <div class="title">
            AYALGA QUICK TRADE
        </div>

        <div class="version">
            V0.10
        </div>

    </div>


    <div id="status" class="status">
        PRUEBA CARGANDO...
    </div>


    <div id="log" class="log">
        HTML EJECUTADO
    </div>

</div>


<script>

    const VERSION = "V0.10";


    document.getElementById("status").textContent =
        "JAVASCRIPT FUNCIONANDO";


    document.getElementById("log").textContent =
        VERSION + "\n" +
        "1. El HTML se ha cargado correctamente.\n" +
        "2. JavaScript se está ejecutando.\n" +
        "3. Hora: " +
        new Date().toLocaleTimeString() +
        "\n" +
        "4. URL: " +
        window.location.href;


    console.log(
        "AYALGA " +
        VERSION +
        ": JAVASCRIPT FUNCIONANDO"
    );

</script>

</body>

</html>
