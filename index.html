<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ayalga Quick Trade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 20px 0;
        }

        .card {
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
        }

        .ok {
            color: #4caf50;
        }

        .wait {
            color: #ffb300;
        }

        .error {
            color: #f44336;
        }

        #log {
            background: #080808;
            border-radius: 8px;
            padding: 10px;
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ayalga Quick Trade</h1>

    <div class="card">

        <div class="label">
            Símbolo recibido por cTrader
        </div>

        <div id="symbol" class="value">
            ---
        </div>

    </div>


    <div class="card">

        <div class="label">
            Estado
        </div>

        <div id="status" class="value wait">
            Inicializando...
        </div>

    </div>


    <div class="card">

        <div class="label">
            Registro
        </div>

        <div id="log"></div>

    </div>

</div>


<script type="module">

    import {
        createClientAdapter,
        handleConfirmEvent,
        registerEvent
    } from "https://esm.sh/@spotware-web-team/sdk";

    import {
        take,
        tap,
        catchError
    } from "https://esm.sh/rxjs";

    import {
        createLogger
    } from "https://esm.sh/@veksa/logger";


    // ============================================================
    // ELEMENTOS
    // ============================================================

    const symbolElement =
        document.getElementById("symbol");

    const statusElement =
        document.getElementById("status");

    const logElement =
        document.getElementById("log");


    // ============================================================
    // LOG
    // ============================================================

    function log(text) {

        const time =
            new Date().toLocaleTimeString();

        logElement.textContent +=
            "[" + time + "] " + text + "\n";

        logElement.scrollTop =
            logElement.scrollHeight;

        console.log(text);
    }


    // ============================================================
    // ESTADO
    // ============================================================

    function status(text, type) {

        statusElement.textContent =
            text;

        statusElement.className =
            "value " + type;
    }


    // ============================================================
    // LEER URL
    // ============================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const symbol =
        params.get("symbol");


    if (symbol) {

        symbolElement.textContent =
            symbol.toUpperCase();

        log(
            "Símbolo recibido: " +
            symbol.toUpperCase()
        );

    } else {

        symbolElement.textContent =
            "NO RECIBIDO";

        log(
            "No se recibió symbol en la URL."
        );
    }


    // ============================================================
    // LOGGER
    // ============================================================

    const logger =
        createLogger(
            location.href.includes("showLogs")
        );


    // ============================================================
    // ADAPTER
    // ============================================================

    let adapter;


    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    function initialize() {

        try {

            log(
                "1. Creando Client Adapter..."
            );


            adapter =
                createClientAdapter({
                    logger
                });


            log(
                "2. Client Adapter creado."
            );


            status(
                "Conectando...",
                "wait"
            );


            // ====================================================
            // CONFIRMACIÓN
            // ====================================================

            log(
                "3. Esperando confirmación..."
            );


            handleConfirmEvent(
                adapter,
                {}
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: () => {

                    log(
                        "4. Confirmación recibida."
                    );

                },

                error: error => {

                    log(
                        "ERROR confirmación: " +
                        JSON.stringify(error)
                    );

                }

            });


            // ====================================================
            // REGISTER
            // ====================================================

            log(
                "5. Registrando plugin..."
            );


            registerEvent(
                adapter
            )
            .pipe(

                take(1),

                tap(() => {

                    log(
                        "6. REGISTER CORRECTO."
                    );


                    status(
                        "CONECTADO",
                        "ok"
                    );


                    // Segundo handshake oficial
                    handleConfirmEvent(
                        adapter,
                        {}
                    )
                    .pipe(
                        take(1)
                    )
                    .subscribe({

                        next: () => {

                            log(
                                "7. Handshake completado."
                            );

                        },

                        error: error => {

                            log(
                                "ERROR segundo handshake: " +
                                JSON.stringify(error)
                            );

                        }

                    );

                }),

                catchError(error => {

                    log(
                        "ERROR REGISTER: " +
                        JSON.stringify(error)
                    );


                    status(
                        "ERROR",
                        "error"
                    );


                    return [];

                })

            )
            .subscribe({

                error: error => {

                    log(
                        "ERROR final subscribe: " +
                        JSON.stringify(error)
                    );


                    status(
                        "ERROR",
                        "error"
                    );

                }

            });

        }

        catch (error) {

            log(
                "ERROR GENERAL: " +
                error
            );


            status(
                "ERROR",
                "error"
            );

        }

    }


    // ============================================================
    // ARRANCAR
    // ============================================================

    log(
        "Iniciando plugin..."
    );


    initialize();

</script>

</body>
</html>
