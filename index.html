<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayalga Quick Trade v15</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .version {
            font-size: 15px;
            font-weight: normal;
            opacity: 0.7;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .connected {
            color: #00c853;
        }

        .error {
            color: #ff5252;
        }

        .info {
            color: #64b5f6;
        }

        .symbol-box {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .symbol-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .symbol-id {
            opacity: 0.7;
        }

        .prices {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .price-box {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            background: #181818;
            text-align: center;
        }

        .price-title {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 6px;
        }

        .price-value {
            font-size: 20px;
            font-weight: bold;
        }

        .symbols {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            background: #181818;
            border-radius: 8px;
        }

        .symbol-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #292929;
        }

        .symbol-row:last-child {
            border-bottom: none;
        }

        .symbol-id-small {
            opacity: 0.5;
        }

        #log {
            margin-top: 15px;
            padding: 12px;
            background: #080808;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Ayalga Quick Trade
        <span class="version">v15</span>
    </h1>

    <div id="status" class="status">
        Conectando...
    </div>

    <div class="symbol-box">

        <div class="symbol-name" id="symbolName">
            Buscando símbolo...
        </div>

        <div class="symbol-id" id="symbolId">
            ID: -
        </div>

        <div class="prices">

            <div class="price-box">
                <div class="price-title">
                    BID
                </div>

                <div class="price-value" id="bid">
                    -
                </div>
            </div>

            <div class="price-box">
                <div class="price-title">
                    ASK
                </div>

                <div class="price-value" id="ask">
                    -
                </div>
            </div>

        </div>

    </div>

    <div class="symbol-box">

        <strong>Símbolos recibidos</strong>

        <div id="symbols" class="symbols">
            Esperando...
        </div>

    </div>

    <div id="log"></div>

</div>


<script type="module">

import {
    createClientAdapter
} from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent
} from "https://esm.sh/@spotware-web-team/sdk";

import {
    take,
    tap,
    catchError
} from "https://esm.sh/rxjs";

import {
    createLogger
} from "https://esm.sh/@veksa/logger";


// ============================================================
// ELEMENTOS
// ============================================================

const statusElement =
    document.getElementById("status");

const symbolNameElement =
    document.getElementById("symbolName");

const symbolIdElement =
    document.getElementById("symbolId");

const symbolsElement =
    document.getElementById("symbols");

const bidElement =
    document.getElementById("bid");

const askElement =
    document.getElementById("ask");

const logElement =
    document.getElementById("log");


// ============================================================
// LOG
// ============================================================

function log(message, type = "") {

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    console.log(line);

    const div =
        document.createElement("div");

    div.textContent = line;

    if (type === "ok") {
        div.className = "connected";
    }

    if (type === "error") {
        div.className = "error";
    }

    if (type === "info") {
        div.className = "info";
    }

    logElement.appendChild(div);

    logElement.scrollTop =
        logElement.scrollHeight;
}


// ============================================================
// URL
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const urlSymbol =
    params.get("symbol");

const platform =
    params.get("platform");

const placement =
    params.get("placement");

const theme =
    params.get("theme");


log(
    "URL: " +
    window.location.href
);

log(
    "Símbolo recibido por URL: " +
    (urlSymbol || "ninguno"),
    "info"
);

log(
    "Plataforma: " +
    (platform || "desconocida"),
    "info"
);

log(
    "Placement: " +
    (placement || "desconocido"),
    "info"
);

log(
    "Tema: " +
    (theme || "desconocido"),
    "info"
);


// ============================================================
// ADAPTER
// ============================================================

let adapter = null;


// ============================================================
// INICIALIZACIÓN
// ============================================================

function init() {

    try {

        log(
            "Creando Client Adapter..."
        );

        const logger =
            createLogger(
                location.href.includes(
                    "showLogs"
                )
            );

        adapter =
            createClientAdapter({
                logger
            });

        log(
            "Client Adapter creado correctamente.",
            "ok"
        );


        // ====================================================
        // CONFIRMACIÓN
        // ====================================================

        log(
            "Enviando confirmación..."
        );

        handleConfirmEvent(
            adapter,
            {}
        )
        .pipe(take(1))
        .subscribe({

            next: () => {

                log(
                    "Confirmación recibida.",
                    "ok"
                );

            },

            error: (err) => {

                log(
                    "Error en confirmación: " +
                    JSON.stringify(err),
                    "error"
                );

            }

        });


        // ====================================================
        // REGISTER
        // ====================================================

        log(
            "Registrando plugin..."
        );

        registerEvent(adapter)
            .pipe(

                take(1),

                tap(() => {

                    log(
                        "Plugin registrado correctamente.",
                        "ok"
                    );


                    // Mantener exactamente
                    // el handshake que funcionaba.

                    handleConfirmEvent(
                        adapter,
                        {}
                    )
                    .pipe(take(1))
                    .subscribe();

                }),

                catchError(err => {

                    log(
                        "Error registrando plugin: " +
                        JSON.stringify(err),
                        "error"
                    );

                    statusElement.textContent =
                        "Error registrando plugin";

                    statusElement.classList.add(
                        "error"
                    );

                    return [];

                })

            )

            .subscribe({

                next: () => {

                    statusElement.textContent =
                        "CONECTADO";

                    statusElement.classList.add(
                        "connected"
                    );

                    log(
                        "Conexión establecida. Cargando símbolos...",
                        "ok"
                    );

                    loadSymbols();

                },

                error: (err) => {

                    statusElement.textContent =
                        "Error de conexión";

                    statusElement.classList.add(
                        "error"
                    );

                    log(
                        "Error final de registro: " +
                        JSON.stringify(err),
                        "error"
                    );

                }

            });

    }

    catch (err) {

        statusElement.textContent =
            "Error inicializando";

        statusElement.classList.add(
            "error"
        );

        log(
            "ERROR INICIALIZANDO: " +
            (err?.stack || err),
            "error"
        );

    }

}


// ============================================================
// CARGAR LISTA DE SÍMBOLOS
// ============================================================

function loadSymbols() {

    log(
        "Solicitando lista de símbolos..."
    );

    getLightSymbolList(
        adapter,
        {}
    )
    .pipe(take(1))
    .subscribe({

        next: (response) => {

            log(
                "Respuesta getLightSymbolList recibida.",
                "ok"
            );


            log(
                "Claves de respuesta: " +
                Object.keys(
                    response || {}
                ).join(", "),
                "info"
            );


            // =================================================
            // ESTRUCTURA REAL CONFIRMADA
            //
            // response
            //     payload
            //         Symbol
            //
            // =================================================

            const symbols =
                response?.payload?.Symbol ?? [];


            log(
                "Cantidad de símbolos recibidos: " +
                symbols.length,
                "ok"
            );


            // =================================================
            // MOSTRAR LISTA
            // =================================================

            symbolsElement.innerHTML = "";


            if (symbols.length === 0) {

                symbolsElement.textContent =
                    "No se encontraron símbolos.";

                log(
                    "La lista de símbolos está vacía.",
                    "error"
                );

                return;
            }


            symbols.forEach(symbol => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "symbol-row";


                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    symbol?.Name ??
                    "SIN NOMBRE";


                const id =
                    document.createElement(
                        "span"
                    );

                id.className =
                    "symbol-id-small";

                id.textContent =
                    "ID: " +
                    (
                        symbol?.Id ??
                        "-"
                    );


                row.appendChild(name);
                row.appendChild(id);

                symbolsElement.appendChild(
                    row
                );

            });


            // =================================================
            // BUSCAR SÍMBOLO ACTIVO
            // =================================================

            if (urlSymbol) {

                const found =
                    symbols.find(
                        s =>
                            String(
                                s?.Name
                            ).toUpperCase() ===
                            String(
                                urlSymbol
                            ).toUpperCase()
                    );


                if (found) {

                    symbolNameElement.textContent =
                        found.Name;

                    symbolIdElement.textContent =
                        "ID: " +
                        found.Id;


                    log(
                        "Símbolo encontrado: " +
                        found.Name +
                        " | ID: " +
                        found.Id,
                        "ok"
                    );


                    // =================================================
                    // AHORA SUSCRIBIMOS LAS COTIZACIONES
                    // =================================================

                    startQuotes(
                        found.Id,
                        found.Name
                    );


                    // También obtenemos la información
                    // completa del símbolo.

                    loadSymbol(
                        found.Id
                    );

                }

                else {

                    symbolNameElement.textContent =
                        "Símbolo no encontrado";

                    symbolIdElement.textContent =
                        "ID: -";


                    log(
                        "No se encontró " +
                        urlSymbol +
                        " en la lista.",
                        "error"
                    );

                }

            }

            else {

                const first =
                    symbols[0];

                if (first) {

                    symbolNameElement.textContent =
                        first.Name;

                    symbolIdElement.textContent =
                        "ID: " +
                        first.Id;


                    startQuotes(
                        first.Id,
                        first.Name
                    );

                }

            }

        },

        error: (err) => {

            log(
                "ERROR getLightSymbolList: " +
                JSON.stringify(err),
                "error"
            );

            symbolsElement.textContent =
                "Error obteniendo símbolos.";

        }

    });

}


// ============================================================
// INFORMACIÓN DEL SÍMBOLO
// ============================================================

function loadSymbol(symbolId) {

    log(
        "Solicitando información del símbolo ID " +
        symbolId +
        "..."
    );


    getSymbol(
        adapter,
        {
            symbolId: [symbolId]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: (response) => {

            log(
                "Respuesta getSymbol recibida.",
                "ok"
            );

            log(
                "Claves getSymbol: " +
                Object.keys(
                    response || {}
                ).join(", "),
                "info"
            );

        },

        error: (err) => {

            log(
                "ERROR getSymbol: " +
                JSON.stringify(err),
                "error"
            );

        }

    });

}


// ============================================================
// COTIZACIONES
// ============================================================

function startQuotes(
    symbolId,
    symbolName
) {

    log(
        "Suscribiendo cotizaciones de " +
        symbolName +
        " | ID " +
        symbolId +
        "..."
    );


    // ========================================================
    // SUSCRIPCIÓN
    // ========================================================

    subscribeQuotes(
        adapter,
        {
            symbolId: [symbolId]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: () => {

            log(
                "Suscripción a cotizaciones realizada.",
                "ok"
            );


            listenQuotes(
                symbolId,
                symbolName
            );

        },

        error: (err) => {

            log(
                "ERROR subscribeQuotes: " +
                JSON.stringify(err),
                "error"
            );

        }

    });

}


// ============================================================
// ESCUCHAR QUOTES
// ============================================================

function listenQuotes(
    symbolId,
    symbolName
) {

    log(
        "Escuchando cotizaciones en tiempo real...",
        "info"
    );


    quoteEvent(adapter)
        .subscribe({

            next: (quote) => {

                try {

                    // =================================================
                    // MOSTRAR SOLO INFORMACIÓN ÚTIL EN LOG
                    // =================================================

                    const quoteSymbolId =
                        quote?.symbolId ??
                        quote?.SymbolId;


                    // Si el evento pertenece a otro símbolo,
                    // lo ignoramos.

                    if (
                        quoteSymbolId !== undefined &&
                        Number(quoteSymbolId) !==
                        Number(symbolId)
                    ) {

                        return;

                    }


                    // =================================================
                    // EXTRAER BID / ASK
                    // =================================================

                    const bidRaw =
                        quote?.bid ??
                        quote?.Bid;

                    const askRaw =
                        quote?.ask ??
                        quote?.Ask;


                    if (
                        bidRaw === undefined &&
                        askRaw === undefined
                    ) {

                        return;

                    }


                    // =================================================
                    // CONVERSIÓN
                    //
                    // cTrader puede entregar precios
                    // en unidades internas.
                    //
                    // Para EURUSD:
                    // 1.12345 -> 112345
                    //
                    // =================================================

                    const bid =
                        convertPrice(
                            bidRaw
                        );

                    const ask =
                        convertPrice(
                            askRaw
                        );


                    if (bid !== null) {

                        bidElement.textContent =
                            formatPrice(bid);

                    }


                    if (ask !== null) {

                        askElement.textContent =
                            formatPrice(ask);

                    }


                }
                catch (err) {

                    log(
                        "Error procesando quote: " +
                        (err?.stack || err),
                        "error"
                    );

                }

            },

            error: (err) => {

                log(
                    "ERROR quoteEvent: " +
                    JSON.stringify(err),
                    "error"
                );

            }

        });

}


// ============================================================
// CONVERTIR PRECIO
// ============================================================

function convertPrice(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number)
    ) {

        return null;

    }


    // ========================================================
    // Si viene en formato interno de 1/100000.
    // ========================================================

    if (
        Math.abs(number) > 10
    ) {

        return number / 100000;

    }


    return number;

}


// ============================================================
// FORMATO PRECIO
// ============================================================

function formatPrice(price) {

    return Number(price)
        .toFixed(5);

}


// ============================================================
// ARRANCAR
// ============================================================

init();

</script>

</body>
</html>
