<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayalga Quick Trade v24</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    h1 {
        font-size: 20px;
        text-align: center;
        margin: 4px 0 16px;
    }

    .version {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-bottom: 15px;
    }

    .section {
        background: #1b1b1b;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .section-title {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 8px;
    }

    label {
        display: block;
        font-size: 13px;
        color: #bbb;
        margin-bottom: 5px;
    }

    select,
    input {
        width: 100%;
        padding: 10px;
        border-radius: 7px;
        border: 1px solid #444;
        background: #252525;
        color: #fff;
        font-size: 14px;
    }

    .row {
        display: flex;
        gap: 8px;
    }

    .row > * {
        flex: 1;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 15px 10px;
        font-size: 17px;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    .buy {
        background: #168a45;
    }

    .sell {
        background: #b52a2a;
    }

    .rr {
        background: #333;
        font-size: 14px;
        padding: 11px;
    }

    .rr.active {
        background: #666;
        border: 1px solid #aaa;
    }

    .close-test {
        background: #d47b00;
    }

    .status {
        padding: 10px;
        border-radius: 7px;
        background: #222;
        font-size: 13px;
        line-height: 1.45;
    }

    .connected {
        color: #35d477;
    }

    .disconnected {
        color: #ff5252;
    }

    #log {
        background: #080808;
        border-radius: 8px;
        padding: 10px;
        height: 260px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .log-line {
        margin-bottom: 5px;
    }

    .ok {
        color: #4ddc7a;
    }

    .error {
        color: #ff5555;
    }

    .info {
        color: #ccc;
    }

    .warning {
        color: #ffb74d;
    }

    .value {
        font-weight: bold;
        color: #fff;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Ayalga Quick Trade</h1>

    <div class="version">
        v24 — prueba closePosition
    </div>

    <!-- CONFIGURACIÓN -->
    <div class="section">

        <div class="section-title">
            CONFIGURACIÓN SL
        </div>

        <label for="candleCount">
            Número de velas cerradas
        </label>

        <input
            id="candleCount"
            type="number"
            min="1"
            value="10"
        >

        <br><br>

        <label for="timeframe">
            Timeframe para calcular SL
        </label>

        <select id="timeframe">
            <option value="1" selected>M1</option>
            <option value="2">M2</option>
            <option value="3">M3</option>
            <option value="4">M4</option>
            <option value="5">M5</option>
            <option value="6">M10</option>
            <option value="7">M15</option>
            <option value="8">M30</option>
            <option value="9">H1</option>
            <option value="10">H4</option>
            <option value="11">H12</option>
            <option value="12">D1</option>
            <option value="13">W1</option>
            <option value="14">MN1</option>
        </select>

    </div>

    <!-- RR -->
    <div class="section">

        <div class="section-title">
            TAKE PROFIT
        </div>

        <div class="row">

            <button
                id="rr1Button"
                class="rr active"
            >
                RR 1:1
            </button>

            <button
                id="rr2Button"
                class="rr"
            >
                RR 1:2
            </button>

        </div>

    </div>

    <!-- OPERACIONES -->
    <div class="section">

        <div class="section-title">
            OPERACIÓN A MERCADO
        </div>

        <div class="row">

            <button
                id="buyButton"
                class="buy"
                disabled
            >
                COMPRA
            </button>

            <button
                id="sellButton"
                class="sell"
                disabled
            >
                VENTA
            </button>

        </div>

    </div>

    <!-- PRUEBA CLOSE -->
    <div class="section">

        <div class="section-title">
            DIAGNÓSTICO DE POSICIÓN
        </div>

        <button
            id="closeTestButton"
            class="close-test"
            disabled
        >
            CERRAR POSICIÓN TEST
        </button>

    </div>

    <!-- ESTADO -->
    <div class="section">

        <div class="section-title">
            ESTADO
        </div>

        <div
            id="status"
            class="status disconnected"
        >
            Desconectado
        </div>

    </div>

    <!-- LOG -->
    <div class="section">

        <div class="section-title">
            LOG
        </div>

        <div id="log"></div>

    </div>

</div>


<script type="module">

import {
    createClientAdapter
} from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent,
    executionEvent,
    createNewOrder,
    modifyOrderProtection,
    closePosition,
    getTrendbarList,
    ServerInterfaces
} from "https://esm.sh/@spotware-web-team/sdk";

import {
    take,
    tap,
    catchError
} from "https://esm.sh/rxjs";

import {
    createLogger
} from "https://esm.sh/@veksa/logger";


/* =========================================================
   ESTADO GENERAL
   ========================================================= */

let adapter = null;

let connected = false;

let currentSymbolName = null;
let currentSymbolId = null;
let symbolInfo = null;

let lastValidBid = null;
let lastValidAsk = null;

let selectedRR = 1;

let pendingTrade = null;


/*
 * IMPORTANTE:
 *
 * Estas dos variables son independientes de pendingTrade.
 *
 * Así podemos probar closePosition aunque después
 * del proceso de SL/TP pendingTrade sea eliminado.
 */
let lastPositionId = null;
let lastPositionVolume = null;


/*
 * Para distinguir una orden de apertura de una
 * petición de cierre.
 */
let closeRequestActive = false;
let closeRequestPositionId = null;


/* =========================================================
   ELEMENTOS UI
   ========================================================= */

const buyButton =
    document.getElementById("buyButton");

const sellButton =
    document.getElementById("sellButton");

const closeTestButton =
    document.getElementById("closeTestButton");

const rr1Button =
    document.getElementById("rr1Button");

const rr2Button =
    document.getElementById("rr2Button");

const statusElement =
    document.getElementById("status");

const logElement =
    document.getElementById("log");

const candleCountInput =
    document.getElementById("candleCount");

const timeframeSelect =
    document.getElementById("timeframe");


/* =========================================================
   LOG
   ========================================================= */

function log(message, type = "info") {

    const line =
        document.createElement("div");

    line.className =
        "log-line " + type;

    const time =
        new Date().toLocaleTimeString();

    line.textContent =
        `[${time}] ${message}`;

    logElement.appendChild(line);

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


/* =========================================================
   ESTADO UI
   ========================================================= */

function updateButtons() {

    buyButton.disabled =
        !connected ||
        !currentSymbolId ||
        !!pendingTrade;

    sellButton.disabled =
        !connected ||
        !currentSymbolId ||
        !!pendingTrade;

    closeTestButton.disabled =
        !connected ||
        !lastPositionId ||
        closeRequestActive;
}


/* =========================================================
   HELPERS PROTOBUF
   ========================================================= */

function getField(object, ...names) {

    if (!object) {
        return null;
    }

    for (const name of names) {

        if (
            object[name] !== undefined &&
            object[name] !== null
        ) {
            return object[name];
        }
    }

    return null;
}


function getPayload(response) {

    if (!response) {
        return null;
    }

    if (response.payload) {
        return response.payload;
    }

    if (response.Payload) {
        return response.Payload;
    }

    return response;
}


function getArray(object, ...names) {

    if (!object) {
        return [];
    }

    for (const name of names) {

        const value =
            object[name];

        if (Array.isArray(value)) {
            return value;
        }
    }

    return [];
}


/* =========================================================
   PRECIO
   ========================================================= */

function normalizePrice(price) {

    const numericPrice =
        Number(price);

    if (!Number.isFinite(numericPrice)) {
        return null;
    }

    const digits =
        Number(
            getField(
                symbolInfo,
                "digits",
                "Digits"
            ) ?? 5
        );

    const factor =
        Math.pow(10, digits);

    const normalized =
        Math.round(
            (numericPrice + Number.EPSILON) *
            factor
        ) / factor;

    return Number(
        normalized.toFixed(digits)
    );
}


function formatPrice(price) {

    const numericPrice =
        Number(price);

    if (!Number.isFinite(numericPrice)) {
        return "N/A";
    }

    const digits =
        Number(
            getField(
                symbolInfo,
                "digits",
                "Digits"
            ) ?? 5
        );

    return numericPrice.toFixed(digits);
}


/* =========================================================
   IDENTIFICADORES
   ========================================================= */

function extractPositionId(payload) {

    if (!payload) {
        return null;
    }

    const position =
        getField(
            payload,
            "Position",
            "position"
        );

    const order =
        getField(
            payload,
            "Order",
            "order"
        );

    const deal =
        getField(
            payload,
            "Deal",
            "deal"
        );

    const direct =
        getField(
            payload,
            "PositionId",
            "positionId"
        );

    if (direct !== null) {
        return Number(direct);
    }

    const positionId =
        getField(
            position,
            "PositionId",
            "positionId"
        );

    if (positionId !== null) {
        return Number(positionId);
    }

    const orderPositionId =
        getField(
            order,
            "PositionId",
            "positionId"
        );

    if (orderPositionId !== null) {
        return Number(orderPositionId);
    }

    const dealPositionId =
        getField(
            deal,
            "PositionId",
            "positionId"
        );

    if (dealPositionId !== null) {
        return Number(dealPositionId);
    }

    return null;
}


/* =========================================================
   PRECIO REAL DE EJECUCIÓN
   ========================================================= */

function extractExecutionPrice(payload) {

    if (!payload) {
        return null;
    }

    const position =
        getField(
            payload,
            "Position",
            "position"
        );

    const deal =
        getField(
            payload,
            "Deal",
            "deal"
        );

    const order =
        getField(
            payload,
            "Order",
            "order"
        );

    const positionPrice =
        getField(
            position,
            "Price",
            "price"
        );

    if (
        positionPrice !== null &&
        Number.isFinite(Number(positionPrice)) &&
        Number(positionPrice) > 0
    ) {
        return Number(positionPrice);
    }

    const dealPrice =
        getField(
            deal,
            "ExecutionPrice",
            "executionPrice"
        );

    if (
        dealPrice !== null &&
        Number.isFinite(Number(dealPrice)) &&
        Number(dealPrice) > 0
    ) {
        return Number(dealPrice);
    }

    const orderPrice =
        getField(
            order,
            "ExecutionPrice",
            "executionPrice"
        );

    if (
        orderPrice !== null &&
        Number.isFinite(Number(orderPrice)) &&
        Number(orderPrice) > 0
    ) {
        return Number(orderPrice);
    }

    return null;
}


/* =========================================================
   TIMEFRAME
   ========================================================= */

function timeframeMinutes(period) {

    switch (Number(period)) {

        case 1:
            return 1;

        case 2:
            return 2;

        case 3:
            return 3;

        case 4:
            return 4;

        case 5:
            return 5;

        case 6:
            return 10;

        case 7:
            return 15;

        case 8:
            return 30;

        case 9:
            return 60;

        case 10:
            return 240;

        case 11:
            return 720;

        case 12:
            return 1440;

        case 13:
            return 10080;

        default:
            return 1;
    }
}


/* =========================================================
   OBTENER VELAS CERRADAS
   ========================================================= */

function getClosedTrendbars() {

    return new Promise((resolve, reject) => {

        const count =
            Math.max(
                1,
                Number(
                    candleCountInput.value
                ) || 10
            );

        const period =
            Number(
                timeframeSelect.value
            );

        const now =
            Date.now();

        const minutes =
            timeframeMinutes(period);

        const currentBarStart =
            Math.floor(
                now /
                (minutes * 60 * 1000)
            ) *
            (minutes * 60 * 1000);

        const fromTimestamp =
            now -
            (
                Math.max(
                    count + 20,
                    50
                ) *
                minutes *
                60 *
                1000
            );

        const toTimestamp =
            now;

        log(
            `Solicitando ${count} velas cerradas en ${timeframeSelect.options[timeframeSelect.selectedIndex].text}...`
        );

        getTrendbarList(
            adapter,
            {
                symbolId: Number(currentSymbolId),
                period: period,
                fromTimestamp: fromTimestamp,
                toTimestamp: toTimestamp,
                count: Math.max(count + 5, 20),
                type:
                    ServerInterfaces
                        .ProtoTrendbarType
                        .REGULAR_OHLC
            }
        )
        .pipe(take(1))
        .subscribe({

            next: response => {

                try {

                    const payload =
                        getPayload(response);

                    let bars =
                        getArray(
                            payload,
                            "Trendbar",
                            "trendbar",
                            "Bars",
                            "bars"
                        );

                    if (!bars.length) {

                        /*
                         * Algunos wrappers pueden devolver
                         * directamente un array.
                         */
                        if (Array.isArray(payload)) {
                            bars = payload;
                        }
                    }

                    if (!bars.length) {

                        reject(
                            new Error(
                                "cTrader no devolvió velas."
                            )
                        );

                        return;
                    }


                    /*
                     * Convertimos timestamp de minutos
                     * a milisegundos.
                     */
                    const normalized =
                        bars
                        .map(bar => {

                            const low =
                                Number(
                                    getField(
                                        bar,
                                        "low",
                                        "Low"
                                    )
                                ) / 100000;

                            const deltaOpen =
                                Number(
                                    getField(
                                        bar,
                                        "deltaOpen",
                                        "DeltaOpen"
                                    )
                                ) / 100000;

                            const deltaClose =
                                Number(
                                    getField(
                                        bar,
                                        "deltaClose",
                                        "DeltaClose"
                                    )
                                ) / 100000;

                            const deltaHigh =
                                Number(
                                    getField(
                                        bar,
                                        "deltaHigh",
                                        "DeltaHigh"
                                    )
                                ) / 100000;

                            const timestampMinutes =
                                Number(
                                    getField(
                                        bar,
                                        "utcTimestampInMinutes",
                                        "UtcTimestampInMinutes"
                                    )
                                );

                            const timestamp =
                                timestampMinutes *
                                60 *
                                1000;

                            return {

                                timestamp,

                                low,

                                open:
                                    low +
                                    deltaOpen,

                                close:
                                    low +
                                    deltaClose,

                                high:
                                    low +
                                    deltaHigh
                            };

                        })
                        .filter(bar =>
                            Number.isFinite(bar.low) &&
                            Number.isFinite(bar.high) &&
                            bar.timestamp <
                            currentBarStart
                        )
                        .sort(
                            (a, b) =>
                                a.timestamp -
                                b.timestamp
                        );


                    const closedBars =
                        normalized.slice(-count);


                    if (
                        closedBars.length <
                        count
                    ) {

                        reject(
                            new Error(
                                `Solo se encontraron ${closedBars.length} velas cerradas de ${count} solicitadas.`
                            )
                        );

                        return;
                    }


                    resolve(closedBars);

                } catch (error) {

                    reject(error);
                }
            },

            error: error => {

                reject(error);
            }
        });
    });
}


/* =========================================================
   CALCULAR SL
   ========================================================= */

async function calculateSL(side) {

    const bars =
        await getClosedTrendbars();


    if (side === "BUY") {

        const lowestLow =
            Math.min(
                ...bars.map(
                    bar => bar.low
                )
            );

        log(
            `BUY SL calculado por cTrader: ${formatPrice(lowestLow)}`,
            "ok"
        );

        return normalizePrice(
            lowestLow
        );
    }


    const highestHigh =
        Math.max(
            ...bars.map(
                bar => bar.high
            )
        );

    log(
        `SELL SL calculado por cTrader: ${formatPrice(highestHigh)}`,
        "ok"
    );

    return normalizePrice(
        highestHigh
    );
}


/* =========================================================
   OBTENER VOLUMEN MÍNIMO
   ========================================================= */

function getMinimumVolume() {

    const minVolume =
        Number(
            getField(
                symbolInfo,
                "minVolume",
                "MinVolume"
            )
        );

    if (
        !Number.isFinite(minVolume) ||
        minVolume <= 0
    ) {
        throw new Error(
            "No se pudo obtener minVolume de cTrader."
        );
    }

    return minVolume;
}


/* =========================================================
   EJECUTAR COMPRA / VENTA
   ========================================================= */

async function executeTrade(side) {

    if (!connected) {

        log(
            "cTrader no está conectado.",
            "error"
        );

        return;
    }


    if (!currentSymbolId) {

        log(
            "No hay símbolo seleccionado.",
            "error"
        );

        return;
    }


    if (pendingTrade) {

        log(
            "Ya existe una operación pendiente.",
            "warning"
        );

        return;
    }


    try {

        const count =
            Number(
                candleCountInput.value
            ) || 10;

        log(
            `${side}: calculando SL con ${count} velas cerradas...`
        );

        log(
            `Timeframe SL: ${timeframeSelect.options[timeframeSelect.selectedIndex].text}`
        );


        /*
         * EL SL SE CALCULA ANTES DE ABRIR.
         */
        const sl =
            await calculateSL(side);


        if (!Number.isFinite(sl)) {

            throw new Error(
                "SL inválido."
            );
        }


        /*
         * TEST ACTUAL:
         * utilizamos volumen mínimo de cTrader.
         */
        const volume =
            getMinimumVolume();


        log(
            `Enviando MARKET con volumen mínimo: ${volume}`
        );


        pendingTrade = {

            side,

            volume,

            calculatedSL: sl,

            rr: selectedRR,

            orderId: null,

            positionId: null
        };


        updateButtons();


        const response =
            await new Promise(
                (resolve, reject) => {

                    createNewOrder(
                        adapter,
                        {
                            symbolId:
                                Number(
                                    currentSymbolId
                                ),

                            orderType:
                                ServerInterfaces
                                    .ProtoOrderType
                                    .MARKET,

                            tradeSide:
                                side === "BUY"
                                    ?
                                    ServerInterfaces
                                        .ProtoTradeSide
                                        .BUY
                                    :
                                    ServerInterfaces
                                        .ProtoTradeSide
                                        .SELL,

                            volume:
                                Number(volume),

                            clientOrderId:
                                `AYALGA_${Date.now()}`
                        }
                    )
                    .pipe(take(1))
                    .subscribe({

                        next: resolve,

                        error: reject
                    });
                }
            );


        log(
            "Respuesta createNewOrder:",
            "info"
        );

        log(
            JSON.stringify(
                response,
                null,
                2
            )
        );


        processOrderResponse(response);

    } catch (error) {

        log(
            `ERROR ejecutando ${side}: ${error.message || error}`,
            "error"
        );

        pendingTrade = null;

        updateButtons();
    }
}


/* =========================================================
   RESPUESTA ORDEN
   ========================================================= */

function processOrderResponse(response) {

    const payload =
        getPayload(response);

    if (!payload) {
        return;
    }


    const order =
        getField(
            payload,
            "Order",
            "order"
        );

    const position =
        getField(
            payload,
            "Position",
            "position"
        );


    const orderId =
        getField(
            order,
            "OrderId",
            "orderId"
        );


    const positionId =
        extractPositionId(
            payload
        );


    if (
        pendingTrade &&
        orderId !== null
    ) {

        pendingTrade.orderId =
            Number(orderId);
    }


    if (
        pendingTrade &&
        positionId !== null
    ) {

        pendingTrade.positionId =
            Number(positionId);

        log(
            `Position ID recibido: ${Number(positionId)}`,
            "ok"
        );
    }


    if (orderId !== null) {

        log(
            `Order ID: ${Number(orderId)}`
        );
    }


    if (position) {

        log(
            `Position status: ${
                getField(
                    position,
                    "PositionStatus",
                    "positionStatus"
                )
            }`
        );
    }
}


/* =========================================================
   EVENTOS DE EJECUCIÓN
   ========================================================= */

function processExecutionEvent(response) {

    const payload =
        getPayload(response);

    if (!payload) {
        return;
    }


    const executionType =
        getField(
            payload,
            "ExecutionType",
            "executionType",
            "PayloadType"
        );


    const positionId =
        extractPositionId(
            payload
        );


    log(
        `EXECUTION EVENT: ${executionType || "desconocido"}`
    );


    log(
        JSON.stringify(
            response,
            null,
            2
        )
    );


    /*
     * IMPORTANTE:
     *
     * Si este evento pertenece a nuestro cierre,
     * NO lo tratamos como una nueva orden de apertura.
     */
    if (
        closeRequestActive &&
        positionId !== null &&
        Number(positionId) ===
        Number(closeRequestPositionId)
    ) {

        log(
            `Evento asociado al cierre de PositionId ${positionId}`,
            "warning"
        );

        return;
    }


    if (
        executionType ===
        "ORDER_ACCEPTED"
    ) {

        processOrderResponse(
            response
        );

        return;
    }


    if (
        executionType ===
        "ORDER_FILLED" ||
        executionType ===
        "ORDER_PARTIAL_FILL"
    ) {

        handleFilledExecution(
            payload
        );

        return;
    }


    if (
        executionType ===
        "ORDER_REJECTED"
    ) {

        log(
            "ORDEN RECHAZADA.",
            "error"
        );

        pendingTrade = null;

        updateButtons();

        return;
    }
}


/* =========================================================
   ORDEN EJECUTADA
   ========================================================= */

function handleFilledExecution(payload) {

    if (!pendingTrade) {

        log(
            "ORDER_FILLED recibido pero no hay pendingTrade.",
            "warning"
        );

        return;
    }


    const positionId =
        extractPositionId(
            payload
        );


    const executionPrice =
        extractExecutionPrice(
            payload
        );


    if (
        positionId === null
    ) {

        log(
            "No se encontró PositionId en ORDER_FILLED.",
            "error"
        );

        return;
    }


    if (
        executionPrice === null
    ) {

        log(
            "No se encontró precio real de ejecución.",
            "error"
        );

        return;
    }


    /*
     * GUARDAMOS EL IDENTIFICADOR NUMÉRICO.
     *
     * NO se añade "PID".
     */
    lastPositionId =
        Number(positionId);

    lastPositionVolume =
        Number(
            pendingTrade.volume
        );


    updateButtons();


    const side =
        pendingTrade.side;

    const sl =
        normalizePrice(
            pendingTrade.calculatedSL
        );


    log(
        `POSITION ID REAL: ${lastPositionId}`,
        "ok"
    );

    log(
        `PRECIO REAL DE FILL: ${formatPrice(executionPrice)}`,
        "ok"
    );

    log(
        `SL: ${formatPrice(sl)}`,
        "ok"
    );


    /*
     * Comprobamos que el SL está
     * en el lado correcto.
     */

    if (
        side === "BUY" &&
        sl >= executionPrice
    ) {

        log(
            "ERROR: BUY tiene SL por encima o igual a la entrada.",
            "error"
        );

        return;
    }


    if (
        side === "SELL" &&
        sl <= executionPrice
    ) {

        log(
            "ERROR: SELL tiene SL por debajo o igual a la entrada.",
            "error"
        );

        return;
    }


    const slDistance =
        Math.abs(
            executionPrice - sl
        );


    const tpDistance =
        slDistance *
        selectedRR;


    let tp;


    if (side === "BUY") {

        tp =
            executionPrice +
            tpDistance;

    } else {

        tp =
            executionPrice -
            tpDistance;
    }


    tp =
        normalizePrice(tp);


    log(
        `TP RR1:${selectedRR}: ${formatPrice(tp)}`,
        "ok"
    );


    /*
     * Dejamos guardada la información
     * para closePosition.
     */
    pendingTrade.positionId =
        Number(positionId);

    pendingTrade.entryPrice =
        executionPrice;

    pendingTrade.finalSL =
        sl;

    pendingTrade.finalTP =
        tp;


    /*
     * Mantenemos la colocación de SL/TP
     * de v23.
     */
    modifyProtectionWithRetry(
        Number(positionId),
        sl,
        tp
    );
}


/* =========================================================
   MODIFICAR SL + TP
   ========================================================= */

function modifyProtectionWithRetry(
    positionId,
    sl,
    tp
) {

    const delays = [
        300,
        500,
        700,
        1000,
        1500
    ];

    let attempt = 0;


    function attemptProtection() {

        const delay =
            delays[attempt];


        setTimeout(() => {

            if (!connected) {

                log(
                    "cTrader desconectado al intentar protección.",
                    "error"
                );

                return;
            }


            const payload = {

                positionId:
                    Number(positionId),

                stopLoss:
                    Number(sl),

                takeProfit:
                    Number(tp)
            };


            log(
                `Intento SL/TP ${attempt + 1}/${delays.length}`,
                "info"
            );

            log(
                `PositionId: ${payload.positionId}`
            );

            log(
                `SL: ${formatPrice(payload.stopLoss)}`
            );

            log(
                `TP: ${formatPrice(payload.takeProfit)}`
            );


            modifyOrderProtection(
                adapter,
                payload
            )
            .pipe(take(1))
            .subscribe({

                next: response => {

                    log(
                        "RESPUESTA modifyOrderProtection:",
                        "info"
                    );

                    log(
                        JSON.stringify(
                            response,
                            null,
                            2
                        )
                    );


                    const responsePayload =
                        getPayload(response);


                    const errorCode =
                        getField(
                            responsePayload,
                            "ErrorCode",
                            "errorCode"
                        );


                    if (!errorCode) {

                        log(
                            "Protección aceptada por cTrader.",
                            "ok"
                        );

                        pendingTrade = null;

                        updateButtons();

                        return;
                    }


                    log(
                        `Error protección: ${errorCode}`,
                        "error"
                    );


                    if (
                        attempt <
                        delays.length - 1
                    ) {

                        attempt++;

                        attemptProtection();

                    } else {

                        log(
                            `AGOTADOS LOS REINTENTOS DE SL + TP. Position ID: ${positionId}`,
                            "error"
                        );

                        log(
                            "La posición queda abierta para realizar la prueba de closePosition.",
                            "warning"
                        );

                        pendingTrade = null;

                        updateButtons();
                    }
                },

                error: error => {

                    log(
                        `Error SDK modifyOrderProtection: ${error.message || error}`,
                        "error"
                    );


                    if (
                        attempt <
                        delays.length - 1
                    ) {

                        attempt++;

                        attemptProtection();

                    } else {

                        log(
                            "Agotados los reintentos de protección.",
                            "error"
                        );

                        pendingTrade = null;

                        updateButtons();
                    }
                }
            });

        }, delay);
    }


    attemptProtection();
}


/* =========================================================
   CLOSE POSITION — PRUEBA
   ========================================================= */

function closeTestPosition() {

    if (!connected) {

        log(
            "cTrader no está conectado.",
            "error"
        );

        return;
    }


    if (!lastPositionId) {

        log(
            "No tenemos ninguna PositionId para cerrar.",
            "error"
        );

        return;
    }


    const positionId =
        Number(lastPositionId);

    const volume =
        Number(lastPositionVolume);


    if (
        !Number.isFinite(positionId) ||
        positionId <= 0
    ) {

        log(
            `PositionId inválido: ${lastPositionId}`,
            "error"
        );

        return;
    }


    if (
        !Number.isFinite(volume) ||
        volume <= 0
    ) {

        log(
            `Volumen inválido: ${lastPositionVolume}`,
            "error"
        );

        return;
    }


    /*
     * MARCAMOS QUE EL PRÓXIMO EVENTO
     * PERTENECE AL CIERRE.
     */
    closeRequestActive =
        true;

    closeRequestPositionId =
        positionId;


    closeTestButton.disabled =
        true;


    const payload = {

        positionId:
            positionId,

        volume:
            volume
    };


    log(
        "========================================",
        "warning"
    );

    log(
        "PRUEBA closePosition",
        "warning"
    );

    log(
        `PositionId enviado: ${positionId}`,
        "warning"
    );

    log(
        `Volume enviado: ${volume}`,
        "warning"
    );

    log(
        `IMPORTANTE: se envía ${positionId}, NO PID${positionId}`,
        "warning"
    );

    log(
        "Payload:",
        "info"
    );

    log(
        JSON.stringify(
            payload,
            null,
            2
        )
    );


    closePosition(
        adapter,
        payload
    )
    .pipe(take(1))
    .subscribe({

        next: response => {

            log(
                "RESPUESTA DIRECTA closePosition:",
                "info"
            );

            log(
                JSON.stringify(
                    response,
                    null,
                    2
                )
            );


            const responsePayload =
                getPayload(response);


            const errorCode =
                getField(
                    responsePayload,
                    "ErrorCode",
                    "errorCode"
                );


            if (errorCode) {

                log(
                    `closePosition RECHAZADO: ${errorCode}`,
                    "error"
                );

                closeRequestActive =
                    false;

                closeRequestPositionId =
                    null;

                updateButtons();

                return;
            }


            log(
                "closePosition aceptado por el SDK.",
                "ok"
            );

            log(
                "Ahora esperamos los eventos de ejecución de cTrader.",
                "ok"
            );
        },

        error: error => {

            log(
                `ERROR DIRECTO closePosition: ${error.message || error}`,
                "error"
            );

            closeRequestActive =
                false;

            closeRequestPositionId =
                null;

            updateButtons();
        }
    });
}


/* =========================================================
   QUOTES
   ========================================================= */

function processQuote(response) {

    const payload =
        getPayload(response);

    if (!payload) {
        return;
    }


    const bid =
        getField(
            payload,
            "Bid",
            "bid"
        );

    const ask =
        getField(
            payload,
            "Ask",
            "ask"
        );


    if (
        bid !== null &&
        Number(bid) > 0
    ) {

        lastValidBid =
            Number(bid);
    }


    if (
        ask !== null &&
        Number(ask) > 0
    ) {

        lastValidAsk =
            Number(ask);
    }
}


/* =========================================================
   CARGAR SÍMBOLOS
   ========================================================= */

function loadSymbols() {

    log(
        "Solicitando lista de símbolos..."
    );


    getLightSymbolList(
        adapter,
        {}
    )
    .pipe(take(1))
    .subscribe({

        next: response => {

            try {

                const payload =
                    getPayload(response);


                const symbols =
                    getArray(
                        payload,
                        "Symbol",
                        "symbol",
                        "Symbols",
                        "symbols"
                    );


                if (!symbols.length) {

                    throw new Error(
                        "No se encontraron símbolos."
                    );
                }


                /*
                 * cTrader pasa el símbolo
                 * en la URL:
                 *
                 * ?symbol=EURUSD
                 */
                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );


                const requestedSymbol =
                    (
                        urlParams.get("symbol") ||
                        ""
                    ).toUpperCase();


                currentSymbolName =
                    requestedSymbol ||
                    "EURUSD";


                const found =
                    symbols.find(
                        symbol =>
                            String(
                                getField(
                                    symbol,
                                    "Name",
                                    "name"
                                )
                            ).toUpperCase() ===
                            currentSymbolName
                    );


                if (!found) {

                    throw new Error(
                        `No se encontró el símbolo ${currentSymbolName}.`
                    );
                }


                currentSymbolId =
                    Number(
                        getField(
                            found,
                            "Id",
                            "id"
                        )
                    );


                log(
                    `Símbolo detectado: ${currentSymbolName}`,
                    "ok"
                );

                log(
                    `SymbolId: ${currentSymbolId}`,
                    "ok"
                );


                loadSymbolDetails();

            } catch (error) {

                log(
                    `Error cargando símbolos: ${error.message || error}`,
                    "error"
                );
            }
        },

        error: error => {

            log(
                `Error getLightSymbolList: ${error.message || error}`,
                "error"
            );
        }
    });
}


/* =========================================================
   DETALLE DEL SÍMBOLO
   ========================================================= */

function loadSymbolDetails() {

    getSymbol(
        adapter,
        {
            symbolId: [
                Number(currentSymbolId)
            ]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: response => {

            try {

                const payload =
                    getPayload(response);


                /*
                 * Dependiendo del wrapper,
                 * puede venir directamente o
                 * dentro de Symbol.
                 */
                const symbol =
                    getField(
                        payload,
                        "Symbol",
                        "symbol"
                    ) ||
                    payload;


                symbolInfo =
                    symbol;


                const minVolume =
                    getField(
                        symbolInfo,
                        "minVolume",
                        "MinVolume"
                    );

                const stepVolume =
                    getField(
                        symbolInfo,
                        "stepVolume",
                        "StepVolume"
                    );

                const maxVolume =
                    getField(
                        symbolInfo,
                        "maxVolume",
                        "MaxVolume"
                    );


                log(
                    `minVolume: ${minVolume}`
                );

                log(
                    `stepVolume: ${stepVolume}`
                );

                log(
                    `maxVolume: ${maxVolume}`
                );


                subscribeToQuotes();

                updateButtons();

            } catch (error) {

                log(
                    `Error leyendo símbolo: ${error.message || error}`,
                    "error"
                );
            }
        },

        error: error => {

            log(
                `Error getSymbol: ${error.message || error}`,
                "error"
            );
        }
    });
}


/* =========================================================
   QUOTES SUBSCRIPTION
   ========================================================= */

function subscribeToQuotes() {

    subscribeQuotes(
        adapter,
        {
            symbolId: [
                Number(currentSymbolId)
            ]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: () => {

            log(
                "Suscripción a quotes realizada.",
                "ok"
            );
        },

        error: error => {

            log(
                `Error subscribeQuotes: ${error.message || error}`,
                "error"
            );
        }
    });
}


/* =========================================================
   HANDSHAKE
   ========================================================= */

function connectPlugin() {

    const logger =
        createLogger(
            location.href.includes(
                "showLogs"
            )
        );


    try {

        adapter =
            createClientAdapter({
                logger
            });


        handleConfirmEvent(
            adapter,
            {}
        )
        .pipe(take(1))
        .subscribe({

            error: error => {

                log(
                    `Error handleConfirmEvent: ${error.message || error}`,
                    "error"
                );
            }
        });


        registerEvent(
            adapter
        )
        .pipe(

            take(1),

            tap(() => {

                log(
                    "Plugin registrado correctamente.",
                    "ok"
                );


                handleConfirmEvent(
                    adapter,
                    {}
                )
                .pipe(take(1))
                .subscribe({

                    error: error => {

                        log(
                            `Error confirmando conexión: ${error.message || error}`,
                            "error"
                        );
                    }
                });
            }),

            catchError(error => {

                log(
                    `Error registerEvent: ${error.message || error}`,
                    "error"
                );

                return [];
            })
        )
        .subscribe({

            next: () => {

                connected =
                    true;


                statusElement.textContent =
                    "Conectado a cTrader";

                statusElement.className =
                    "status connected";


                updateButtons();


                /*
                 * Eventos de ejecución.
                 */
                executionEvent(
                    adapter
                )
                .subscribe({

                    next: response => {

                        processExecutionEvent(
                            response
                        );
                    },

                    error: error => {

                        log(
                            `Error executionEvent: ${error.message || error}`,
                            "error"
                        );
                    }
                });


                /*
                 * Eventos de cotización.
                 */
                quoteEvent(
                    adapter
                )
                .subscribe({

                    next: response => {

                        processQuote(
                            response
                        );
                    },

                    error: error => {

                        log(
                            `Error quoteEvent: ${error.message || error}`,
                            "error"
                        );
                    }
                });


                loadSymbols();
            },

            error: error => {

                connected =
                    false;


                statusElement.textContent =
                    "Error de conexión";

                statusElement.className =
                    "status disconnected";


                updateButtons();


                log(
                    `Error conectando plugin: ${error.message || error}`,
                    "error"
                );
            }
        });

    } catch (error) {

        log(
            `Error inicializando SDK: ${error.message || error}`,
            "error"
        );
    }
}
