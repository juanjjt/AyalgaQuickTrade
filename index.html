<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ayalga Quick Trade v13</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111111;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .version {
            font-size: 19px;
            font-weight: bold;
        }

        .card {
            background: #222222;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .label {
            font-size: 12px;
            color: #999999;
            margin-bottom: 7px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
        }

        .waiting {
            color: #ffb300;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }

        .log {
            background: #080808;
            border-radius: 8px;
            padding: 12px;
            min-height: 180px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- ========================================================
         TÍTULO
         ======================================================== -->

    <div class="title">

        Ayalga Quick Trade
        <span class="version">v13</span>

    </div>


    <!-- ========================================================
         SÍMBOLO
         ======================================================== -->

    <div class="card">

        <div class="label">
            Símbolo
        </div>

        <div
            id="symbol"
            class="value"
        >
            ---
        </div>

    </div>


    <!-- ========================================================
         ESTADO
         ======================================================== -->

    <div class="card">

        <div class="label">
            Estado
        </div>

        <div
            id="status"
            class="value waiting"
        >
            Inicializando...
        </div>

    </div>


    <!-- ========================================================
         REGISTRO
         ======================================================== -->

    <div class="card">

        <div class="label">
            Registro
        </div>

        <div
            id="log"
            class="log"
        ></div>

    </div>


</div>


<script type="module">


    // ============================================================
    // SDK CTRADER
    // ============================================================

    import {

        createClientAdapter,
        handleConfirmEvent,
        registerEvent

    } from "https://esm.sh/@spotware-web-team/sdk";


    // ============================================================
    // RXJS
    // ============================================================

    import {

        take,
        tap,
        catchError

    } from "https://esm.sh/rxjs";


    // ============================================================
    // LOGGER
    // ============================================================

    import {

        createLogger

    } from "https://esm.sh/@veksa/logger";


    // ============================================================
    // ELEMENTOS
    // ============================================================

    const symbolElement =
        document.getElementById("symbol");

    const statusElement =
        document.getElementById("status");

    const logElement =
        document.getElementById("log");


    // ============================================================
    // LOG
    // ============================================================

    function log(message) {

        const time =
            new Date().toLocaleTimeString();

        logElement.textContent +=
            "[" +
            time +
            "] " +
            message +
            "\n";

        logElement.scrollTop =
            logElement.scrollHeight;

        console.log(message);

    }


    // ============================================================
    // ESTADO
    // ============================================================

    function setStatus(
        message,
        type
    ) {

        statusElement.textContent =
            message;

        statusElement.className =
            "value " + type;

    }


    // ============================================================
    // LEER SYMBOL DE CTRADER
    // ============================================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const symbol =
        params.get("symbol");


    if (symbol) {

        symbolElement.textContent =
            symbol.toUpperCase();

        log(
            "Symbol recibido: " +
            symbol.toUpperCase()
        );

    } else {

        symbolElement.textContent =
            "NO RECIBIDO";

        log(
            "No hay symbol en la URL."
        );

    }


    // ============================================================
    // LOGGER
    // ============================================================

    const logger =
        createLogger(
            location.href.includes("showLogs")
        );


    // ============================================================
    // ADAPTER
    // ============================================================

    let adapter = null;


    // ============================================================
    // INICIO
    // ============================================================

    function initialize() {

        try {

            // ----------------------------------------------------
            // 1. CREAR ADAPTER
            // ----------------------------------------------------

            log(
                "Creando Client Adapter..."
            );


            adapter =
                createClientAdapter({
                    logger
                });


            log(
                "Client Adapter creado."
            );


            // ----------------------------------------------------
            // 2. REGISTER
            // ----------------------------------------------------

            log(
                "Registrando plugin..."
            );


            registerEvent(
                adapter
            )
            .pipe(

                take(1),

                tap(() => {

                    log(
                        "REGISTER recibido correctamente."
                    );


                    // ------------------------------------------------
                    // 3. CONFIRM
                    // ------------------------------------------------

                    log(
                        "Enviando confirmación..."
                    );


                    handleConfirmEvent(
                        adapter,
                        {}
                    )
                    .pipe(
                        take(1)
                    )
                    .subscribe({

                        next: () => {

                            log(
                                "Confirmación completada."
                            );


                            setStatus(
                                "CONECTADO",
                                "success"
                            );

                        },

                        error: error => {

                            log(
                                "ERROR confirmación: " +
                                stringify(error)
                            );


                            setStatus(
                                "ERROR CONFIRMACIÓN",
                                "error"
                            );

                        }

                    });

                }),

                catchError(error => {

                    log(
                        "ERROR REGISTER: " +
                        stringify(error)
                    );


                    setStatus(
                        "ERROR REGISTER",
                        "error"
                    );


                    return [];

                })

            )
            .subscribe({

                error: error => {

                    log(
                        "ERROR SUBSCRIBE: " +
                        stringify(error)
                    );


                    setStatus(
                        "ERROR",
                        "error"
                    );

                }

            });

        }

        catch (error) {

            log(
                "ERROR GENERAL: " +
                stringify(error)
            );


            setStatus(
                "ERROR",
                "error"
            );

        }

    }


    // ============================================================
    // CONVERTIR ERROR A TEXTO
    // ============================================================

    function stringify(value) {

        try {

            if (value instanceof Error) {

                return value.message;

            }

            return JSON.stringify(value);

        }
        catch (e) {

            return String(value);

        }

    }


    // ============================================================
    // ARRANCAR
    // ============================================================

    log(
        "Ayalga Quick Trade v13 iniciando..."
    );


    initialize();


</script>

</body>

</html>
