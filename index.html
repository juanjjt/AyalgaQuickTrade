<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayalga Quick Trade v16</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .version {
            font-size: 15px;
            font-weight: normal;
            opacity: 0.7;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .connected {
            color: #00c853;
        }

        .error {
            color: #ff5252;
        }

        .info {
            color: #64b5f6;
        }

        .symbol-box {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .symbol-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .symbol-id {
            opacity: 0.7;
        }

        .prices {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .price-box {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            background: #181818;
            text-align: center;
        }

        .price-title {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 6px;
        }

        .price-value {
            font-size: 20px;
            font-weight: bold;
        }

        .symbols {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            background: #181818;
            border-radius: 8px;
        }

        .symbol-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #292929;
        }

        .symbol-row:last-child {
            border-bottom: none;
        }

        .symbol-id-small {
            opacity: 0.5;
        }

        #log {
            margin-top: 15px;
            padding: 12px;
            background: #080808;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Ayalga Quick Trade
        <span class="version">v16</span>
    </h1>

    <div id="status" class="status">
        Conectando...
    </div>

    <div class="symbol-box">

        <div class="symbol-name" id="symbolName">
            Buscando símbolo...
        </div>

        <div class="symbol-id" id="symbolId">
            ID: -
        </div>

        <div class="prices">

            <div class="price-box">

                <div class="price-title">
                    BID
                </div>

                <div class="price-value" id="bid">
                    -
                </div>

            </div>

            <div class="price-box">

                <div class="price-title">
                    ASK
                </div>

                <div class="price-value" id="ask">
                    -
                </div>

            </div>

        </div>

    </div>

    <div class="symbol-box">

        <strong>Símbolos recibidos</strong>

        <div id="symbols" class="symbols">
            Esperando...
        </div>

    </div>

    <div id="log"></div>

</div>


<script type="module">

import {
    createClientAdapter
} from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent
} from "https://esm.sh/@spotware-web-team/sdk";

import {
    take,
    tap,
    catchError
} from "https://esm.sh/rxjs";

import {
    createLogger
} from "https://esm.sh/@veksa/logger";


// ============================================================
// ELEMENTOS
// ============================================================

const statusElement =
    document.getElementById("status");

const symbolNameElement =
    document.getElementById("symbolName");

const symbolIdElement =
    document.getElementById("symbolId");

const symbolsElement =
    document.getElementById("symbols");

const bidElement =
    document.getElementById("bid");

const askElement =
    document.getElementById("ask");

const logElement =
    document.getElementById("log");


// ============================================================
// VARIABLES PRINCIPALES
// ============================================================

let adapter = null;

let activeSymbolId = null;

let activeSymbolName = null;


// ============================================================
// ÚLTIMOS PRECIOS VÁLIDOS
//
// IMPORTANTE:
// BID y ASK se almacenan por separado.
//
// Si cTrader manda un evento donde solamente cambia BID,
// conservamos el último ASK válido.
//
// Si solamente cambia ASK,
// conservamos el último BID válido.
//
// Nunca sustituimos un precio válido por 0.
// ============================================================

let lastValidBid = null;

let lastValidAsk = null;


// ============================================================
// LOG
// ============================================================

function log(message, type = "") {

    const time =
        new Date().toLocaleTimeString();

    const line =
        `[${time}] ${message}`;

    console.log(line);

    const div =
        document.createElement("div");

    div.textContent = line;

    if (type === "ok") {
        div.className = "connected";
    }

    if (type === "error") {
        div.className = "error";
    }

    if (type === "info") {
        div.className = "info";
    }

    logElement.appendChild(div);

    logElement.scrollTop =
        logElement.scrollHeight;
}


// ============================================================
// INFORMACIÓN DE LA URL
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const urlSymbol =
    params.get("symbol");

const platform =
    params.get("platform");

const placement =
    params.get("placement");

const theme =
    params.get("theme");


log(
    "URL: " +
    window.location.href
);

log(
    "Símbolo recibido por URL: " +
    (urlSymbol || "ninguno"),
    "info"
);

log(
    "Plataforma: " +
    (platform || "desconocida"),
    "info"
);

log(
    "Placement: " +
    (placement || "desconocido"),
    "info"
);

log(
    "Tema: " +
    (theme || "desconocido"),
    "info"
);


// ============================================================
// INICIALIZACIÓN
// ============================================================

function init() {

    try {

        log(
            "Creando Client Adapter..."
        );

        const logger =
            createLogger(
                location.href.includes(
                    "showLogs"
                )
            );

        adapter =
            createClientAdapter({
                logger
            });

        log(
            "Client Adapter creado correctamente.",
            "ok"
        );


        // ====================================================
        // CONFIRMACIÓN
        // ====================================================

        log(
            "Enviando confirmación..."
        );

        handleConfirmEvent(
            adapter,
            {}
        )
        .pipe(take(1))
        .subscribe({

            next: () => {

                log(
                    "Confirmación recibida.",
                    "ok"
                );

            },

            error: (err) => {

                log(
                    "Error en confirmación: " +
                    safeStringify(err),
                    "error"
                );

            }

        });


        // ====================================================
        // REGISTER
        // ====================================================

        log(
            "Registrando plugin..."
        );

        registerEvent(adapter)
            .pipe(

                take(1),

                tap(() => {

                    log(
                        "Plugin registrado correctamente.",
                        "ok"
                    );


                    // Mantenemos exactamente
                    // el handshake que ya funcionaba.

                    handleConfirmEvent(
                        adapter,
                        {}
                    )
                    .pipe(take(1))
                    .subscribe();

                }),

                catchError(err => {

                    log(
                        "Error registrando plugin: " +
                        safeStringify(err),
                        "error"
                    );

                    statusElement.textContent =
                        "Error registrando plugin";

                    statusElement.classList.add(
                        "error"
                    );

                    return [];

                })

            )

            .subscribe({

                next: () => {

                    statusElement.textContent =
                        "CONECTADO";

                    statusElement.classList.add(
                        "connected"
                    );

                    log(
                        "Conexión establecida. Cargando símbolos...",
                        "ok"
                    );

                    loadSymbols();

                },

                error: (err) => {

                    statusElement.textContent =
                        "Error de conexión";

                    statusElement.classList.add(
                        "error"
                    );

                    log(
                        "Error final de registro: " +
                        safeStringify(err),
                        "error"
                    );

                }

            });

    }

    catch (err) {

        statusElement.textContent =
            "Error inicializando";

        statusElement.classList.add(
            "error"
        );

        log(
            "ERROR INICIALIZANDO: " +
            (err?.stack || err),
            "error"
        );

    }

}


// ============================================================
// LISTA DE SÍMBOLOS
// ============================================================

function loadSymbols() {

    log(
        "Solicitando lista de símbolos..."
    );

    getLightSymbolList(
        adapter,
        {}
    )
    .pipe(take(1))
    .subscribe({

        next: (response) => {

            log(
                "Respuesta getLightSymbolList recibida.",
                "ok"
            );


            log(
                "Claves de respuesta: " +
                Object.keys(
                    response || {}
                ).join(", "),
                "info"
            );


            // =================================================
            // ESTRUCTURA REAL DE CTRADER
            //
            // response.payload.Symbol
            // =================================================

            const symbols =
                response?.payload?.Symbol ?? [];


            log(
                "Cantidad de símbolos recibidos: " +
                symbols.length,
                "ok"
            );


            symbolsElement.innerHTML = "";


            if (symbols.length === 0) {

                symbolsElement.textContent =
                    "No se encontraron símbolos.";

                log(
                    "La lista de símbolos está vacía.",
                    "error"
                );

                return;
            }


            // =================================================
            // MOSTRAR TODOS LOS SÍMBOLOS
            // =================================================

            symbols.forEach(symbol => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "symbol-row";


                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    symbol?.Name ??
                    "SIN NOMBRE";


                const id =
                    document.createElement(
                        "span"
                    );

                id.className =
                    "symbol-id-small";

                id.textContent =
                    "ID: " +
                    (
                        symbol?.Id ??
                        "-"
                    );


                row.appendChild(name);
                row.appendChild(id);

                symbolsElement.appendChild(
                    row
                );

            });


            // =================================================
            // BUSCAR SÍMBOLO ACTIVO
            // =================================================

            let found = null;


            if (urlSymbol) {

                found =
                    symbols.find(
                        s =>
                            String(
                                s?.Name
                            ).toUpperCase() ===
                            String(
                                urlSymbol
                            ).toUpperCase()
                    );

            }


            // Si no viene símbolo por URL,
            // utilizamos el primero disponible.

            if (!found && symbols.length > 0) {

                found =
                    symbols[0];

            }


            if (!found) {

                symbolNameElement.textContent =
                    "Símbolo no encontrado";

                symbolIdElement.textContent =
                    "ID: -";

                return;

            }


            // =================================================
            // GUARDAR SÍMBOLO ACTIVO
            // =================================================

            activeSymbolId =
                Number(found.Id);

            activeSymbolName =
                found.Name;


            symbolNameElement.textContent =
                activeSymbolName;

            symbolIdElement.textContent =
                "ID: " +
                activeSymbolId;


            log(
                "Símbolo activo: " +
                activeSymbolName +
                " | ID: " +
                activeSymbolId,
                "ok"
            );


            // =================================================
            // INFORMACIÓN DEL SÍMBOLO
            // =================================================

            loadSymbol(
                activeSymbolId
            );


            // =================================================
            // COTIZACIONES
            // =================================================

            startQuotes(
                activeSymbolId,
                activeSymbolName
            );

        },

        error: (err) => {

            log(
                "ERROR getLightSymbolList: " +
                safeStringify(err),
                "error"
            );

            symbolsElement.textContent =
                "Error obteniendo símbolos.";

        }

    });

}


// ============================================================
// INFORMACIÓN DEL SÍMBOLO
// ============================================================

function loadSymbol(symbolId) {

    log(
        "Solicitando información del símbolo ID " +
        symbolId +
        "..."
    );


    getSymbol(
        adapter,
        {
            symbolId: [symbolId]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: (response) => {

            log(
                "Respuesta getSymbol recibida.",
                "ok"
            );


            log(
                "Claves getSymbol: " +
                Object.keys(
                    response || {}
                ).join(", "),
                "info"
            );

        },

        error: (err) => {

            log(
                "ERROR getSymbol: " +
                safeStringify(err),
                "error"
            );

        }

    });

}


// ============================================================
// SUSCRIBIR COTIZACIONES
// ============================================================

function startQuotes(
    symbolId,
    symbolName
) {

    log(
        "Suscribiendo cotizaciones de " +
        symbolName +
        " | ID " +
        symbolId +
        "..."
    );


    subscribeQuotes(
        adapter,
        {
            symbolId: [symbolId]
        }
    )
    .pipe(take(1))
    .subscribe({

        next: () => {

            log(
                "Suscripción a cotizaciones realizada.",
                "ok"
            );


            listenQuotes(
                symbolId,
                symbolName
            );

        },

        error: (err) => {

            log(
                "ERROR subscribeQuotes: " +
                safeStringify(err),
                "error"
            );

        }

    });

}


// ============================================================
// ESCUCHAR COTIZACIONES
// ============================================================

function listenQuotes(
    symbolId,
    symbolName
) {

    log(
        "Escuchando cotizaciones en tiempo real...",
        "info"
    );


    quoteEvent(adapter)
        .subscribe({

            next: (quote) => {

                try {

                    // =================================================
                    // IDENTIFICAR SÍMBOLO
                    // =================================================

                    const quoteSymbolId =
                        quote?.symbolId ??
                        quote?.SymbolId;


                    if (
                        quoteSymbolId !== undefined &&
                        Number(quoteSymbolId) !==
                        Number(symbolId)
                    ) {

                        return;

                    }


                    // =================================================
                    // OBTENER BID Y ASK
                    // =================================================

                    const bidRaw =
                        quote?.bid ??
                        quote?.Bid;

                    const askRaw =
                        quote?.ask ??
                        quote?.Ask;


                    // =================================================
                    // BID
                    //
                    // SOLO aceptamos un BID positivo.
                    //
                    // Si viene 0, null o undefined:
                    // conservamos el último BID.
                    // =================================================

                    const bid =
                        convertPrice(
                            bidRaw
                        );


                    if (
                        bid !== null &&
                        bid > 0
                    ) {

                        lastValidBid =
                            bid;

                        bidElement.textContent =
                            formatPrice(
                                lastValidBid
                            );

                    }


                    // =================================================
                    // ASK
                    //
                    // SOLO aceptamos un ASK positivo.
                    //
                    // Si viene 0, null o undefined:
                    // conservamos el último ASK.
                    // =================================================

                    const ask =
                        convertPrice(
                            askRaw
                        );


                    if (
                        ask !== null &&
                        ask > 0
                    ) {

                        lastValidAsk =
                            ask;

                        askElement.textContent =
                            formatPrice(
                                lastValidAsk
                            );

                    }


                    // =================================================
                    // IMPORTANTE
                    //
                    // Estos precios son únicamente INFORMATIVOS.
                    //
                    // NO se utilizarán para ejecutar operaciones.
                    //
                    // Las operaciones futuras serán enviadas:
                    //
                    //       A MERCADO
                    //
                    // y el precio real será el que devuelva
                    // CTRADER en el evento de ejecución.
                    // =================================================

                }
                catch (err) {

                    log(
                        "Error procesando quote: " +
                        (
                            err?.stack ||
                            err
                        ),
                        "error"
                    );

                }

            },

            error: (err) => {

                log(
                    "ERROR quoteEvent: " +
                    safeStringify(err),
                    "error"
                );

            }

        });

}


// ============================================================
// CONVERSIÓN DE PRECIO
// ============================================================

function convertPrice(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    const number =
        Number(value);


    if (
        !Number.isFinite(number) ||
        number <= 0
    ) {

        return null;

    }


    // ========================================================
    // Formato interno de precio de cTrader.
    //
    // Ejemplo:
    //
    // 112345 -> 1.12345
    //
    // ========================================================

    if (
        Math.abs(number) > 10
    ) {

        return number / 100000;

    }


    return number;

}


// ============================================================
// FORMATO
// ============================================================

function formatPrice(price) {

    return Number(price)
        .toFixed(5);

}


// ============================================================
// JSON SEGURO PARA LOG
// ============================================================

function safeStringify(value) {

    try {

        return JSON.stringify(
            value
        );

    }
    catch {

        return String(value);

    }

}


// ============================================================
// ARRANCAR
// ============================================================

init();

</script>

</body>
</html>
