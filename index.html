<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ayalga Quick Trade V18</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 14px;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 2px;
}

.symbol-top {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

.pilot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #b32626;
    box-shadow: 0 0 6px rgba(179, 38, 38, 0.7);
    flex-shrink: 0;
}

.pilot.connected {
    background: #168a45;
    box-shadow: 0 0 6px rgba(22, 138, 69, 0.7);
}

.section {
    background: #1b1b1b;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
}

.row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.row:last-child {
    margin-bottom: 0;
}

#timeframeButtons {
    flex-wrap: nowrap;
    gap: 5px;
}

label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
}

button {
    border: none;
    border-radius: 9px;
    color: white;
    font-weight: bold;
    font-size: 16px;
    min-height: 48px;
    cursor: pointer;
    touch-action: manipulation;
}

button:disabled {
    opacity: 0.35;
}

.buy {
    background: #168a45;
    flex: 1;
    font-size: 18px;
    min-height: 56px;
}

.sell {
    background: #b32626;
    flex: 1;
    font-size: 18px;
    min-height: 56px;
}

.close-test {
    background: #d17a00;
    width: 100%;
    min-height: 52px;
    font-size: 16px;
}

.rr-button,
.risk-button,
.multiplier-button,
.candle-button {
    flex: 1;
    background: #333;
    border: 2px solid #555;
    min-height: 46px;
    font-size: 15px;
    min-width: 58px;
}

.tf-button {
    flex: 1;
    background: #333;
    border: 2px solid #555;
    min-height: 42px;
    font-size: 13px;
    min-width: 0;
    padding: 0 2px;
}

.rr-button.active,
.tf-button.active,
.risk-button.active,
.multiplier-button.active,
.candle-button.active {
    background: #555;
    border-color: white;
}

.net-tp-line {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin: -4px 2px 8px 0;
    color: #888;
    font-size: 12px;
}

.net-toggle {
    position: relative;
    width: 34px;
    min-width: 34px;
    height: 18px;
    min-height: 18px;
    padding: 0;
    border: 1px solid #555;
    border-radius: 10px;
    background: #292929;
}

.net-toggle span {
    position: absolute;
    width: 12px;
    height: 12px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: #888;
    transition: transform .15s ease, background .15s ease;
}

.net-toggle.active {
    background: #444;
    border-color: #888;
}

.net-toggle.active span {
    transform: translateX(16px);
    background: #fff;
}

.info-section {
    display: none;
}

#log {
    background: #050505;
    border: 1px solid #333;
    border-radius: 7px;
    padding: 10px;
    height: 260px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
}

.log-title {
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 15px;
}

.plugin-footer {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: #888;
}

.danger { color: #ff6666; }
.success { color: #4ddd82; }
.warning { color: #ffd35a; }
.muted { color: #999; }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div id="symbolDisplay" class="symbol-top">---</div>
        <div id="pilot" class="pilot"></div>
    </div>

    <div class="section">
        <label>Velas de Swing para SL</label>
        <div class="row">
            <button class="candle-button" data-candles="5">5</button>
            <button class="candle-button active" data-candles="10">10</button>
        </div>
        <input id="candleCount" type="hidden" value="10">
    </div>

    <div class="section">
        <label>Marco temporal</label>
        <div class="row" id="timeframeButtons">
            <button class="tf-button active" data-tf="1">M1</button>
            <button class="tf-button" data-tf="15">M15</button>
        </div>
    </div>

    <div class="section">
        <label>RIESGO EN DÓLARES</label>

        <div class="row">
            <button class="risk-button active" data-risk="25">25</button>
            <button class="risk-button" data-risk="50">50</button>
            <button class="risk-button" data-risk="100">100</button>
            <button class="risk-button" data-risk="200">200</button>
        </div>

        <label>MULTIPLICADOR</label>

        <div class="row">
            <button class="multiplier-button active" data-multiplier="1">X1</button>
            <button class="multiplier-button" data-multiplier="2">X2</button>
            <button class="multiplier-button" data-multiplier="3">X3</button>
            <button class="multiplier-button" data-multiplier="4">X4</button>
        </div>

        <input id="riskAmount" type="hidden" value="25">
    </div>

    <div class="section">
        <div class="row">
            <button id="buyButton" class="buy" disabled>COMPRA</button>
            <button id="sellButton" class="sell" disabled>VENTA</button>
        </div>
    </div>

    <div class="section">
        <div class="row">
            <button id="closePositionButton" class="close-test" disabled>CIERRE MANUAL</button>
        </div>
    </div>

    <div class="section">
        <label>RATIO RIESGO / BENEFICIO</label>
        <div class="row">
            <button id="rr1" class="rr-button active">RR 1:1</button>
            <button id="rr2" class="rr-button">RR 1:2</button>
        </div>
    </div>

    <div class="net-tp-line">
        <span>TP neto</span>
        <button id="netTpButton" class="net-toggle" type="button" aria-pressed="false">
            <span></span>
        </button>
    </div>

    <div class="section info-section">
        <div id="symbolDisplayHidden"></div>
        <div id="rrDisplay">1:1</div>
        <div id="bidDisplay">---</div>
        <div id="askDisplay">---</div>
        <div id="minVolumeDisplay">---</div>
        <div id="orderVolumeDisplay">---</div>
        <div id="slDisplay">---</div>
        <div id="tpDisplay">---</div>
        <div id="positionDisplay">---</div>
        <div id="entryDisplay">---</div>
    </div>

    <div class="section">
        <div class="log-title">REGISTRO</div>
        <div id="log"></div>
    </div>

    <div class="plugin-footer">Ayalga Quick Trade · V18</div>
</div>

<script type="module">

import { createClientAdapter } from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent,
    executionEvent,
    createNewOrder,
    modifyOrderProtection,
    closePosition,
    getTrendbarList,
    ServerInterfaces
} from "https://esm.sh/@spotware-web-team/sdk";

import { take, tap, catchError } from "https://esm.sh/rxjs";
import { createLogger } from "https://esm.sh/@veksa/logger";


// ============================================================
// VARIABLES
// ============================================================

let adapter = null;
let connected = false;

let symbolId = null;
let symbolName = "";
let symbolInfo = null;

let lastValidBid = null;
let lastValidAsk = null;

let selectedRR = 1;
let selectedRiskMultiplier = 1;
let selectedRRNet = localStorage.getItem("ayalgaTpNeto") === "1";
let selectedTimeframe = 1;

let pendingTrade = null;

let protectionSent = false;
let protectionRetryCount = 0;

const protectionRetryDelays = [250, 500, 750, 1000, 1500, 2000, 3000];

let lastPositionId = null;
let lastPositionVolume = null;
let closePositionRequest = false;

const DOUBLE_CLICK_MS = 1500;

let lastClickBuy = 0;
let lastClickSell = 0;
let lastClickClose = 0;


// ============================================================
// ELEMENTOS UI
// ============================================================

const pilotElement = document.getElementById("pilot");
const buyButton = document.getElementById("buyButton");
const sellButton = document.getElementById("sellButton");
const closePositionButton = document.getElementById("closePositionButton");

const rr1Button = document.getElementById("rr1");
const rr2Button = document.getElementById("rr2");
const netTpButton = document.getElementById("netTpButton");

const candleCountInput = document.getElementById("candleCount");
const riskAmountInput = document.getElementById("riskAmount");

const symbolDisplay = document.getElementById("symbolDisplay");
const rrDisplay = document.getElementById("rrDisplay");
const bidDisplay = document.getElementById("bidDisplay");
const askDisplay = document.getElementById("askDisplay");
const minVolumeDisplay = document.getElementById("minVolumeDisplay");
const orderVolumeDisplay = document.getElementById("orderVolumeDisplay");
const slDisplay = document.getElementById("slDisplay");
const tpDisplay = document.getElementById("tpDisplay");
const positionDisplay = document.getElementById("positionDisplay");
const entryDisplay = document.getElementById("entryDisplay");
const logElement = document.getElementById("log");

const logger = createLogger(location.href.includes("showLogs"));


// ============================================================
// LOG
// ============================================================

function log(message, type = "") {
    const now = new Date();

    const time = now.toLocaleTimeString("es-ES", {
        hour12: false
    });

    const line = `[${time}] ${message}`;
    const div = document.createElement("div");

    div.textContent = line;

    if (type === "error") div.className = "danger";
    if (type === "ok") div.className = "success";
    if (type === "warning") div.className = "warning";
    if (type === "muted") div.className = "muted";

    logElement.appendChild(div);
    logElement.scrollTop = logElement.scrollHeight;

    console.log(line);
}


function setStatus(text) {
    if (text === "CONECTADO") {
        pilotElement.classList.add("connected");
    } else {
        pilotElement.classList.remove("connected");
    }
}


// ============================================================
// HELPERS
// ============================================================

function getField(obj, ...names) {
    if (!obj) return null;

    for (const name of names) {
        if (obj[name] !== undefined && obj[name] !== null) {
            return obj[name];
        }
    }

    return null;
}


function getPayload(response) {
    if (!response) return null;
    return response.payload || response;
}


function getArray(obj, ...names) {
    if (!obj) return [];

    for (const name of names) {
        if (Array.isArray(obj[name])) {
            return obj[name];
        }
    }

    return [];
}


function normalizePrice(price) {
    const numericPrice = Number(price);

    if (!Number.isFinite(numericPrice)) {
        return null;
    }

    const digits = Number(getField(symbolInfo, "digits", "Digits") ?? 5);
    const factor = Math.pow(10, digits);

    return Number(
        (Math.round((numericPrice + Number.EPSILON) * factor) / factor)
            .toFixed(digits)
    );
}


function formatPrice(price) {
    const numericPrice = Number(price);

    if (!Number.isFinite(numericPrice)) {
        return "---";
    }

    const digits = Number(getField(symbolInfo, "digits", "Digits") ?? 5);
    return numericPrice.toFixed(digits);
}


function roundToDigits(value) {
    const digits = Number(getField(symbolInfo, "digits", "Digits") ?? 5);

    return Number(
        Number(value).toFixed(
            Number.isFinite(digits) ? digits : 5
        )
    );
}


function getTimeframeName(period) {
    const names = {
        1: "M1",
        5: "M5",
        15: "M15",
        30: "M30",
        60: "H1",
        240: "H4"
    };

    return names[period] || String(period);
}


function fmtTime(timestamp) {
    const d = new Date(Number(timestamp));

    if (!Number.isFinite(d.getTime())) {
        return "--:--";
    }

    return d.toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });
}


// ============================================================
// BOTONES TIMEFRAME
// ============================================================

document.querySelectorAll(".tf-button").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tf-button").forEach(
            b => b.classList.remove("active")
        );

        btn.classList.add("active");
        selectedTimeframe = Number(btn.dataset.tf);

        log(
            `Timeframe SL seleccionado: ${getTimeframeName(selectedTimeframe)}`,
            "ok"
        );
    });
});


// ============================================================
// BOTONES VELAS
// ============================================================

document.querySelectorAll(".candle-button").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".candle-button").forEach(
            b => b.classList.remove("active")
        );

        btn.classList.add("active");
        candleCountInput.value = btn.dataset.candles;

        log(
            `Velas de Swing para SL: ${btn.dataset.candles}`,
            "ok"
        );
    });
});


// ============================================================
// BOTONES RIESGO + MULTIPLICADOR V18
// ============================================================

// Se memoriza la cantidad base.
// El multiplicador siempre comienza en X1.

const savedBaseRisk = Number(
    localStorage.getItem("ayalgaRiskAmount")
);

if ([25, 50, 100, 200].includes(savedBaseRisk)) {
    riskAmountInput.value = String(savedBaseRisk);
}


document.querySelectorAll(".risk-button").forEach(btn => {
    btn.classList.toggle(
        "active",
        Number(btn.dataset.risk) === Number(riskAmountInput.value)
    );

    btn.addEventListener("click", () => {
        document.querySelectorAll(".risk-button").forEach(
            b => b.classList.remove("active")
        );

        btn.classList.add("active");
        riskAmountInput.value = btn.dataset.risk;

        localStorage.setItem(
            "ayalgaRiskAmount",
            btn.dataset.risk
        );

        const effectiveRisk =
            Number(btn.dataset.risk) * selectedRiskMultiplier;

        log(
            `Riesgo base seleccionado: ${btn.dataset.risk} $ | X${selectedRiskMultiplier} = ${effectiveRisk.toFixed(2)} $`,
            "ok"
        );
    });
});


// El multiplicador NO se memoriza.
selectedRiskMultiplier = 1;


document.querySelectorAll(".multiplier-button").forEach(btn => {
    btn.classList.toggle(
        "active",
        Number(btn.dataset.multiplier) === 1
    );

    btn.addEventListener("click", () => {
        document.querySelectorAll(".multiplier-button").forEach(
            b => b.classList.remove("active")
        );

        btn.classList.add("active");

        selectedRiskMultiplier =
            Number(btn.dataset.multiplier);

        const baseRisk =
            Number(riskAmountInput.value);

        const effectiveRisk =
            baseRisk * selectedRiskMultiplier;

        log(
            `Multiplicador seleccionado: X${selectedRiskMultiplier} | ${baseRisk.toFixed(2)} $ × ${selectedRiskMultiplier} = ${effectiveRisk.toFixed(2)} $`,
            "ok"
        );
    });
});


// ============================================================
// RR
// ============================================================

rr1Button.addEventListener("click", () => {
    selectedRR = 1;

    rr1Button.classList.add("active");
    rr2Button.classList.remove("active");

    rrDisplay.textContent = "1:1";

    log("RR seleccionado: 1:1", "ok");
});


rr2Button.addEventListener("click", () => {
    selectedRR = 2;

    rr2Button.classList.add("active");
    rr1Button.classList.remove("active");

    rrDisplay.textContent = "1:2";

    log("RR seleccionado: 1:2", "ok");
});


netTpButton.classList.toggle("active", selectedRRNet);

netTpButton.setAttribute(
    "aria-pressed",
    String(selectedRRNet)
);


netTpButton.addEventListener("click", () => {
    selectedRRNet = !selectedRRNet;

    localStorage.setItem(
        "ayalgaTpNeto",
        selectedRRNet ? "1" : "0"
    );

    netTpButton.classList.toggle(
        "active",
        selectedRRNet
    );

    netTpButton.setAttribute(
        "aria-pressed",
        String(selectedRRNet)
    );

    log(
        selectedRRNet
            ? "TP NETO activado"
            : "TP NETO desactivado",
        "ok"
    );
});


// ============================================================
// BOTONES
// ============================================================

function updateButtons() {
    const enabled =
        connected &&
        symbolId !== null &&
        symbolInfo !== null &&
        !pendingTrade;

    buyButton.disabled = !enabled;
    sellButton.disabled = !enabled;

    closePositionButton.disabled =
        !connected ||
        lastPositionId === null ||
        closePositionRequest;
}


// ============================================================
// URL
// ============================================================

function getSymbolFromURL() {
    return new URLSearchParams(window.location.search).get("symbol");
}


// ============================================================
// INICIO
// ============================================================

async function initialize() {
    log(
        "Ayalga Quick Trade V18 - multiplicadores de riesgo + motor V17 de TP NETO",
        "ok"
    );

    log("Iniciando...");

    try {
        adapter = createClientAdapter({ logger });

        handleConfirmEvent(adapter, {})
            .pipe(take(1))
            .subscribe({
                next: () => log(
                    "Confirmación inicial recibida.",
                    "ok"
                ),

                error: err => log(
                    "Error en confirmación: " +
                    JSON.stringify(err),
                    "error"
                )
            });

        registerEvent(adapter)
            .pipe(
                take(1),

                tap(() => {
                    log(
                        "Plugin registrado correctamente.",
                        "ok"
                    );

                    handleConfirmEvent(adapter, {})
                        .pipe(take(1))
                        .subscribe();

                    connected = true;

                    setStatus("CONECTADO");
                    updateButtons();

                    subscribeExecutionEvents();
                    subscribeQuoteEvents();
                    loadSymbols();
                }),

                catchError(err => {
                    log(
                        "Error registrando plugin: " +
                        JSON.stringify(err),
                        "error"
                    );

                    return [];
                })
            )
            .subscribe({
                error: err => log(
                    "Error general de registro: " +
                    JSON.stringify(err),
                    "error"
                )
            });

    } catch (error) {
        log(
            "ERROR INICIANDO: " + error.message,
            "error"
        );
    }
}


// ============================================================
// SUBSCRIPCIONES
// ============================================================

function subscribeExecutionEvents() {
    try {
        log("Suscribiendo executionEvent...");

        executionEvent(adapter).subscribe({
            next: event => processExecutionEvent(event),

            error: error => log(
                "Error executionEvent: " +
                JSON.stringify(error),
                "error"
            )
        });

        log(
            "executionEvent suscrito correctamente.",
            "ok"
        );

    } catch (error) {
        log(
            "Error suscribiendo executionEvent: " +
            error.message,
            "error"
        );
    }
}


function subscribeQuoteEvents() {
    try {
        log("Suscribiendo quoteEvent...");

        quoteEvent(adapter).subscribe({
            next: quote => processQuote(quote),

            error: error => log(
                "Error quoteEvent: " +
                JSON.stringify(error),
                "error"
            )
        });

        log(
            "quoteEvent suscrito correctamente.",
            "ok"
        );

    } catch (error) {
        log(
            "Error suscribiendo quoteEvent: " +
            error.message,
            "error"
        );
    }
}


// ============================================================
// QUOTES
// ============================================================

function processQuote(response) {
    const payload = getPayload(response);

    if (!payload) return;

    function normalizeQuotePrice(raw) {
        let p = Number(raw);

        if (!Number.isFinite(p) || p <= 0) {
            return null;
        }

        if (p > 10000) {
            p = p / 100000;
        }

        return p;
    }

    const quotes = getArray(
        payload,
        "quote",
        "Quote"
    );

    if (quotes.length > 0) {
        for (const q of quotes) {
            const qSymbolId = Number(
                getField(q, "symbolId", "SymbolId")
            );

            if (
                symbolId !== null &&
                qSymbolId !== symbolId
            ) {
                continue;
            }

            const bid = normalizeQuotePrice(
                getField(q, "bid", "Bid")
            );

            const ask = normalizeQuotePrice(
                getField(q, "ask", "Ask")
            );

            if (bid !== null) {
                lastValidBid = bid;
                bidDisplay.textContent = formatPrice(bid);
            }

            if (ask !== null) {
                lastValidAsk = ask;
                askDisplay.textContent = formatPrice(ask);
            }
        }

        return;
    }

    const qSymbolId = Number(
        getField(payload, "symbolId", "SymbolId")
    );

    if (
        symbolId !== null &&
        Number.isFinite(qSymbolId) &&
        qSymbolId !== symbolId
    ) {
        return;
    }

    const bid = normalizeQuotePrice(
        getField(payload, "bid", "Bid")
    );

    const ask = normalizeQuotePrice(
        getField(payload, "ask", "Ask")
    );

    if (bid !== null) {
        lastValidBid = bid;
        bidDisplay.textContent = formatPrice(bid);
    }

    if (ask !== null) {
        lastValidAsk = ask;
        askDisplay.textContent = formatPrice(ask);
    }
}


// ============================================================
// SÍMBOLOS
// ============================================================

function loadSymbols() {
    log("Buscando símbolos en cTrader...");

    getLightSymbolList(adapter, {})
        .pipe(take(1))
        .subscribe({
            next: response => {
                try {
                    const payload = getPayload(response);

                    const symbols = getArray(
                        payload,
                        "Symbol",
                        "symbol"
                    );

                    log(
                        "Símbolos recibidos: " +
                        symbols.length
                    );

                    const requestedSymbol =
                        getSymbolFromURL();

                    let selectedSymbol = null;

                    if (requestedSymbol) {
                        selectedSymbol = symbols.find(
                            s =>
                                String(
                                    getField(
                                        s,
                                        "Name",
                                        "name"
                                    )
                                ).toUpperCase() ===
                                requestedSymbol.toUpperCase()
                        );
                    }

                    if (!selectedSymbol) {
                        selectedSymbol = symbols.find(
                            s =>
                                String(
                                    getField(
                                        s,
                                        "Name",
                                        "name"
                                    )
                                ).toUpperCase() ===
                                "EURUSD"
                        );
                    }

                    if (!selectedSymbol) {
                        log(
                            "No se encontró el símbolo.",
                            "error"
                        );

                        return;
                    }

                    symbolId = Number(
                        getField(
                            selectedSymbol,
                            "Id",
                            "id"
                        )
                    );

                    symbolName = String(
                        getField(
                            selectedSymbol,
                            "Name",
                            "name"
                        )
                    );

                    symbolDisplay.textContent =
                        symbolName;

                    log(
                        `Símbolo detectado: ${symbolName} (ID ${symbolId})`,
                        "ok"
                    );

                    getDetailedSymbol();

                } catch (error) {
                    log(
                        "Error procesando símbolos: " +
                        error.message,
                        "error"
                    );
                }
            },

            error: error => log(
                "Error obteniendo símbolos: " +
                JSON.stringify(error),
                "error"
            )
        });
}
