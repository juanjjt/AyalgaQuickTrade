<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ayalga Quick Trade</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #111;
            color: #fff;
        }

        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            margin: 0 0 14px 0;
            font-size: 22px;
        }

        .status {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;

            border-radius: 7px;

            background: #292929;

            font-size: 13px;
        }

        .status.connected {
            background: #123d22;
        }

        .status.error {
            background: #4a1717;
        }

        .panel {
            width: 100%;

            padding: 15px;

            border-radius: 9px;

            background: #1b1b1b;
        }

        .section {
            margin-bottom: 15px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-size: 13px;
            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            height: 42px;

            padding: 8px 10px;

            border: 1px solid #444;
            border-radius: 6px;

            background: #292929;
            color: #fff;

            font-size: 15px;
        }

        .rr-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;
        }

        button {

            border: 0;

            border-radius: 7px;

            color: #fff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .rr {

            height: 44px;

            background: #363636;
        }

        .rr.active {
            background: #0066cc;
        }

        .double {

            width: 100%;

            height: 44px;

            margin-top: 8px;

            background: #3a3a3a;
        }

        .double.active {
            background: #b27a00;
        }

        .trade-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 18px;
        }

        .buy {

            height: 60px;

            background: #16833b;

            font-size: 18px;
        }

        .sell {

            height: 60px;

            background: #b32929;

            font-size: 18px;
        }

        .info {

            margin-top: 15px;

            padding: 12px;

            border-radius: 7px;

            background: #242424;

            font-size: 12px;

            line-height: 1.7;
        }

        .info-row {

            display: flex;

            justify-content: space-between;

            gap: 10px;
        }

        .info-value {
            font-weight: bold;
            text-align: right;
        }

        .log {

            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            background: #0d0d0d;

            font-family: Consolas, monospace;

            font-size: 11px;

            white-space: pre-wrap;

            word-break: break-word;

            max-height: 180px;

            overflow-y: auto;
        }

    </style>

</head>


<body>

<div class="app">

    <h1>
        Ayalga Quick Trade
    </h1>


    <div
        id="connectionStatus"
        class="status"
    >
        Conectando con cTrader...
    </div>


    <div class="panel">


        <!-- =====================================================
             RIESGO
        ====================================================== -->

        <div class="section">

            <label>
                Riesgo base
            </label>

            <input
                id="risk"
                type="number"
                value="100"
                min="0"
                step="1"
            >

        </div>


        <!-- =====================================================
             VELAS SL
        ====================================================== -->

        <div class="section">

            <label>
                Número de velas cerradas para SL
            </label>

            <input
                id="candleCount"
                type="number"
                value="10"
                min="1"
                step="1"
            >

        </div>


        <!-- =====================================================
             TIMEFRAME
        ====================================================== -->

        <div class="section">

            <label>
                Timeframe del SL
            </label>

            <select id="timeframe">

                <option value="M1" selected>
                    M1
                </option>

                <option value="M5">
                    M5
                </option>

                <option value="M15">
                    M15
                </option>

                <option value="M30">
                    M30
                </option>

                <option value="H1">
                    H1
                </option>

                <option value="H4">
                    H4
                </option>

                <option value="D1">
                    D1
                </option>

            </select>

        </div>


        <!-- =====================================================
             RR
        ====================================================== -->

        <div class="section">

            <label>
                Risk / Reward
            </label>

            <div class="rr-buttons">

                <button
                    id="rr1"
                    class="rr active"
                    type="button"
                >
                    RR 1:1
                </button>

                <button
                    id="rr2"
                    class="rr"
                    type="button"
                >
                    RR 1:2
                </button>

            </div>

        </div>


        <!-- =====================================================
             DOBLE RIESGO
        ====================================================== -->

        <button
            id="doubleRisk"
            class="double"
            type="button"
        >
            DOBLE RIESGO: OFF
        </button>


        <!-- =====================================================
             COMPRA / VENTA
        ====================================================== -->

        <div class="trade-buttons">

            <button
                id="buyButton"
                class="buy"
                type="button"
                disabled
            >
                COMPRA
            </button>

            <button
                id="sellButton"
                class="sell"
                type="button"
                disabled
            >
                VENTA
            </button>

        </div>


        <!-- =====================================================
             INFORMACIÓN
        ====================================================== -->

        <div class="info">

            <div class="info-row">

                <span>
                    Cuenta
                </span>

                <span
                    id="accountText"
                    class="info-value"
                >
                    —
                </span>

            </div>


            <div class="info-row">

                <span>
                    Símbolo
                </span>

                <span
                    id="symbolText"
                    class="info-value"
                >
                    —
                </span>

            </div>


            <div class="info-row">

                <span>
                    Plataforma
                </span>

                <span
                    id="platformText"
                    class="info-value"
                >
                    —
                </span>

            </div>


            <div class="info-row">

                <span>
                    RR
                </span>

                <span
                    id="rrText"
                    class="info-value"
                >
                    1:1
                </span>

            </div>


            <div class="info-row">

                <span>
                    Riesgo próximo trade
                </span>

                <span
                    id="riskText"
                    class="info-value"
                >
                    $100
                </span>

            </div>


            <div class="info-row">

                <span>
                    Estado
                </span>

                <span
                    id="resultText"
                    class="info-value"
                >
                    Esperando...
                </span>

            </div>

        </div>


        <!-- =====================================================
             LOG
        ====================================================== -->

        <div
            id="log"
            class="log"
        >
            Iniciando...
        </div>


    </div>

</div>


<script type="module">


/*
====================================================================
 AYALGA QUICK TRADE
 V0.3

 CONEXIÓN REAL CON cTRADER WEBVIEW PLUGIN SDK

 IMPORTANTE:
 ESTA VERSIÓN NO ENVÍA ÓRDENES.

 OBJETIVO:

 1. Detectar parámetros enviados por cTrader.
 2. Conectar con el host de cTrader.
 3. Completar handshake.
 4. Obtener información de cuenta.
 5. Obtener lista de símbolos.
 6. Escuchar cotizaciones.
 7. Escuchar eventos de ejecución.

 DESPUÉS:

 8. Obtener velas.
 9. Calcular SL absoluto.
10. Calcular volumen.
11. Crear MARKET.
12. Obtener precio REAL de ejecución.
13. Colocar SL.
14. Colocar TP.
15. Gestionar DOBLE RIESGO.

====================================================================
*/


/*
====================================================================
 IMPORTACIONES OFICIALES
====================================================================
*/

import {
    createClientAdapter
}
from "https://esm.sh/@spotware-web-team/sdk-external-api";


import {
    cancelOrder,
    closePosition,
    createNewOrder,
    executionEvent,
    getAccountInformation,
    getLightSymbolList,
    getSymbol,
    handleConfirmEvent,
    modifyOrderProtection,
    quoteEvent,
    registerEvent,
    ServerInterfaces,
    subscribeQuotes
}
from "https://esm.sh/@spotware-web-team/sdk";


import {
    take,
    tap,
    catchError
}
from "https://esm.sh/rxjs";


import {
    createLogger
}
from "https://esm.sh/@veksa/logger";


/*
====================================================================
 ESTADO
====================================================================
*/

let adapter = null;

let connectedToHost = false;

let selectedRR = 1;

let doubleRisk = false;

let accountData = null;

let symbolsData = null;


/*
====================================================================
 ELEMENTOS
====================================================================
*/

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const buyButton =
    document.getElementById(
        "buyButton"
    );


const sellButton =
    document.getElementById(
        "sellButton"
    );


const accountText =
    document.getElementById(
        "accountText"
    );


const symbolText =
    document.getElementById(
        "symbolText"
    );


const platformText =
    document.getElementById(
        "platformText"
    );


const resultText =
    document.getElementById(
        "resultText"
    );


const logElement =
    document.getElementById(
        "log"
    );


/*
====================================================================
 LOG
====================================================================
*/

function writeLog(message) {

    let text;

    if (
        typeof message === "string"
    ) {

        text = message;

    } else {

        try {

            text =
                JSON.stringify(
                    message,
                    null,
                    2
                );

        } catch {

            text =
                String(message);

        }

    }


    console.log(
        "[AYALGA]",
        message
    );


    logElement.textContent +=
        "\n" +
        text;


    logElement.scrollTop =
        logElement.scrollHeight;

}


/*
====================================================================
 PARÁMETROS QUE ENVÍA cTRADER
====================================================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const ctraderTheme =
    urlParams.get("theme") || "dark";


const ctraderSymbol =
    urlParams.get("symbol") || "";


const ctraderLanguage =
    urlParams.get("lang") || "es";


const ctraderPlatform =
    urlParams.get("platform") || "";


const ctraderPlacement =
    urlParams.get("placement") || "";


const ctraderPluginId =
    urlParams.get("id") || "";


/*
====================================================================
 MOSTRAR DATOS RECIBIDOS
====================================================================
*/

symbolText.textContent =
    ctraderSymbol || "Símbolo actual";


platformText.textContent =
    ctraderPlatform || "cTrader";


writeLog(
    "Parámetros recibidos:"
);


writeLog({
    theme: ctraderTheme,
    symbol: ctraderSymbol,
    lang: ctraderLanguage,
    platform: ctraderPlatform,
    placement: ctraderPlacement,
    id: ctraderPluginId
});


/*
====================================================================
 TEMA CLARO / OSCURO
====================================================================
*/

function applyTheme() {

    if (
        ctraderTheme === "light"
    ) {

        document.body.style.background =
            "#f2f2f2";

        document.body.style.color =
            "#111";

        document
            .querySelectorAll(
                ".panel, .info"
            )
            .forEach(element => {

                element.style.background =
                    "#ffffff";

            });


        document
            .querySelectorAll(
                "input, select"
            )
            .forEach(element => {

                element.style.background =
                    "#ffffff";

                element.style.color =
                    "#111";

                element.style.borderColor =
                    "#cccccc";

            });


        logElement.style.background =
            "#eeeeee";

        logElement.style.color =
            "#111";

    }

}


/*
====================================================================
 APLICAR TEMA
====================================================================
*/

applyTheme();


/*
====================================================================
 DOBLE RIESGO
====================================================================
*/

function updateRiskText() {

    const baseRisk =
        Number(
            document.getElementById(
                "risk"
            ).value
        ) || 0;


    const effectiveRisk =
        doubleRisk
            ? baseRisk * 2
            : baseRisk;


    document.getElementById(
        "riskText"
    ).textContent =
        "$" +
        effectiveRisk;

}


document
    .getElementById("risk")
    .addEventListener(
        "input",
        updateRiskText
    );


/*
====================================================================
 RR 1:1
====================================================================
*/

document
    .getElementById("rr1")
    .addEventListener(
        "click",
        () => {

            selectedRR = 1;


            document
                .getElementById("rr1")
                .classList.add(
                    "active"
                );


            document
                .getElementById("rr2")
                .classList.remove(
                    "active"
                );


            document
                .getElementById("rrText")
                .textContent =
                    "1:1";

        }
    );


/*
====================================================================
 RR 1:2
====================================================================
*/

document
    .getElementById("rr2")
    .addEventListener(
        "click",
        () => {

            selectedRR = 2;


            document
                .getElementById("rr2")
                .classList.add(
                    "active"
                );


            document
                .getElementById("rr1")
                .classList.remove(
                    "active"
                );


            document
                .getElementById("rrText")
                .textContent =
                    "1:2";

        }
    );


/*
====================================================================
 DOBLE RIESGO
====================================================================
*/

document
    .getElementById("doubleRisk")
    .addEventListener(
        "click",
        () => {

            doubleRisk =
                !doubleRisk;


            const button =
                document.getElementById(
                    "doubleRisk"
                );


            if (doubleRisk) {

                button.classList.add(
                    "active"
                );

                button.textContent =
                    "DOBLE RIESGO: ON";

            } else {

                button.classList.remove(
                    "active"
                );

                button.textContent =
                    "DOBLE RIESGO: OFF";

            }


            updateRiskText();

        }
    );


/*
====================================================================
 ERROR DE CONEXIÓN
====================================================================
*/

function connectionError(error) {

    console.error(
        "[AYALGA ERROR]",
        error
    );


    writeLog(
        "ERROR DE CONEXIÓN:"
    );


    writeLog(error);


    connectionStatus.textContent =
        "✕ Error de conexión con cTrader";


    connectionStatus.classList.remove(
        "connected"
    );


    connectionStatus.classList.add(
        "error"
    );


    resultText.textContent =
        "Error";

}


/*
====================================================================
 OBTENER INFORMACIÓN DE CUENTA
====================================================================
*/

function loadAccountInformation() {

    if (
        !connectedToHost
    ) {

        return;

    }


    writeLog(
        "Solicitando información de cuenta..."
    );


    getAccountInformation(
        adapter,
        {}
    )
    .pipe(

        take(1),

        tap(response => {

            accountData =
                response;


            writeLog(
                "INFORMACIÓN DE CUENTA RECIBIDA:"
            );


            writeLog(
                response
            );


            const account =
                response?.account;


            if (
                account
            ) {

                /*
                 * De momento no forzamos
                 * una estructura concreta.
                 *
                 * Guardamos toda la respuesta.
                 */

                if (
                    account.accountId !== undefined
                ) {

                    accountText.textContent =
                        String(
                            account.accountId
                        );

                } else {

                    accountText.textContent =
                        "Conectada";

                }

            } else {

                accountText.textContent =
                    "Conectada";

            }


            resultText.textContent =
                "Cuenta conectada";

        }),

        catchError(error => {

            writeLog(
                "Error obteniendo cuenta:"
            );


            writeLog(error);


            resultText.textContent =
                "Error cuenta";


            return [];

        })

    )
    .subscribe();

}


/*
====================================================================
 OBTENER SÍMBOLOS
====================================================================
*/

function loadSymbols() {

    if (
        !connectedToHost
    ) {

        return;

    }


    writeLog(
        "Solicitando lista de símbolos..."
    );


    getLightSymbolList(
        adapter,
        {}
    )
    .pipe(

        take(1),

        tap(response => {

            symbolsData =
                response;


            writeLog(
                "LISTA DE SÍMBOLOS RECIBIDA."
            );


            writeLog(
                response
            );


            resultText.textContent =
                "Símbolos recibidos";

        }),

        catchError(error => {

            writeLog(
                "Error obteniendo símbolos:"
            );


            writeLog(error);


            return [];

        })

    )
    .subscribe();

}


/*
====================================================================
 CONEXIÓN CON cTRADER
====================================================================

 SECUENCIA OFICIAL:

 CONFIRM
    ↓
REGISTER
    ↓
CONFIRM
    ↓
CONNECTED

====================================================================
*/

function connectToCTrader() {

    try {

        writeLog(
            "Creando conexión con cTrader..."
        );


        /*
         * Logger oficial.
         */

        const logger =
            createLogger(
                window.location.href.includes(
                    "showLogs"
                )
            );


        /*
         * Crear adaptador.
         */

        adapter =
            createClientAdapter({
                logger
            });


        writeLog(
            "Adaptador creado."
        );


        /*
         * Primer CONFIRM.
         */

        handleConfirmEvent(
            adapter,
            {}
        )
        .pipe(
            take(1)
        )
        .subscribe();


        writeLog(
            "CONFIRM inicial enviado."
        );


        /*
         * REGISTER.
         */

        registerEvent(
            adapter
        )
        .pipe(

            take(1),

            tap(() => {

                writeLog(
                    "cTrader ha registrado el plugin."
                );


                /*
                 * Segundo CONFIRM.
                 */

                handleConfirmEvent(
                    adapter,
                    {}
                )
                .pipe(
                    take(1)
                )
                .subscribe();


                /*
                 * CONEXIÓN COMPLETADA.
                 */

                connectedToHost =
                    true;


                connectionStatus.textContent =
                    "✓ CONECTADO A cTRADER";


                connectionStatus.classList.add(
                    "connected"
                );


                buyButton.disabled =
                    false;


                sellButton.disabled =
                    false;


                resultText.textContent =
                    "Conectado";


                writeLog(
                    "✓ CONEXIÓN COMPLETADA."
                );


                /*
                 * Ahora pedimos datos.
                 */

                loadAccountInformation();

                loadSymbols();

            }),

            catchError(error => {

                connectionError(
                    error
                );


                return [];

            })

        )
        .subscribe();

    }

    catch (error) {

        connectionError(
            error
        );

    }

}


/*
====================================================================
 ESCUCHAR COTIZACIONES
====================================================================
*/

function startQuoteStream() {

    if (
        !connectedToHost
    ) {

        return;

    }


    writeLog(
        "Activando stream de cotizaciones..."
    );


    quoteEvent(
        adapter
    )
    .pipe(

        tap(quote => {

            /*
             * No escribimos cada tick
             * permanentemente en pantalla,
             * porque llenaría el log.
             */

            console.log(
                "[AYALGA QUOTE]",
                quote
            );

        })

    )
    .subscribe();

}


/*
====================================================================
 ESCUCHAR EJECUCIONES
====================================================================
*/

function startExecutionStream() {

    if (
        !connectedToHost
    ) {

        return;

    }


    writeLog(
        "Activando stream de ejecuciones..."
    );


    executionEvent(
        adapter
    )
    .pipe(

        tap(event => {

            writeLog(
                "EVENTO DE EJECUCIÓN:"
            );


            writeLog(
                event
            );

        })

    )
    .subscribe();

}


/*
====================================================================
 BOTÓN COMPRA
====================================================================
*/

buyButton.addEventListener(
    "click",
    () => {

        if (
            !connectedToHost
        ) {

            return;

        }


        const risk =
            Number(
                document.getElementById(
                    "risk"
                ).value
            ) || 0;


        const candleCount =
            Number(
                document.getElementById(
                    "candleCount"
                ).value
            ) || 1;


        const timeframe =
            document.getElementById(
                "timeframe"
            ).value;


        const effectiveRisk =
            doubleRisk
                ? risk * 2
                : risk;


        writeLog({
            action: "BUY_TEST",
            risk: effectiveRisk,
            candleCount,
            timeframe,
            rr: selectedRR,
            symbol: ctraderSymbol
        });


        resultText.textContent =
            "COMPRA preparada";


        /*
         * NO SE ENVÍA NINGUNA ORDEN TODAVÍA.
         */

    }
);


/*
====================================================================
 BOTÓN VENTA
====================================================================
*/

sellButton.addEventListener(
    "click",
    () => {

        if (
            !connectedToHost
        ) {

            return;

        }


        const risk =
            Number(
                document.getElementById(
                    "risk"
                ).value
            ) || 0;


        const candleCount =
            Number(
                document.getElementById(
                    "candleCount"
                ).value
            ) || 1;


        const timeframe =
            document.getElementById(
                "timeframe"
            ).value;


        const effectiveRisk =
            doubleRisk
                ? risk * 2
                : risk;


        writeLog({
            action: "SELL_TEST",
            risk: effectiveRisk,
            candleCount,
            timeframe,
            rr: selectedRR,
            symbol: ctraderSymbol
        });


        resultText.textContent =
            "VENTA preparada";


        /*
         * NO SE ENVÍA NINGUNA ORDEN TODAVÍA.
         */

    }
);


/*
====================================================================
 INICIO
====================================================================
*/

writeLog(
    "Ayalga Quick Trade iniciado."
);


writeLog(
    "Esperando conexión con cTrader..."
);


updateRiskText();


connectToCTrader();


/*
 * Cuando el handshake termine,
 * activamos los streams.
 *
 * Usamos una pequeña comprobación porque
 * registerEvent es asíncrono.
 */

const streamTimer =
    setInterval(
        () => {

            if (
                connectedToHost
            ) {

                clearInterval(
                    streamTimer
                );


                startQuoteStream();

                startExecutionStream();

            }

        },
        100
    );


</script>

</body>

</html>
