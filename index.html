<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayalga Quick Trade v14</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
        }

        .version {
            font-size: 15px;
            font-weight: normal;
            opacity: 0.7;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .connected {
            color: #00c853;
        }

        .error {
            color: #ff5252;
        }

        .info {
            color: #64b5f6;
        }

        .symbol-box {
            padding: 15px;
            border-radius: 8px;
            background: #222;
            margin-bottom: 15px;
        }

        .symbol-name {
            font-size: 22px;
            font-weight: bold;
        }

        .symbol-id {
            margin-top: 5px;
            opacity: 0.7;
        }

        .symbols {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: #181818;
            border-radius: 8px;
        }

        .symbol-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #292929;
        }

        .symbol-row:last-child {
            border-bottom: none;
        }

        .symbol-id-small {
            opacity: 0.5;
        }

        #log {
            margin-top: 15px;
            padding: 12px;
            background: #080808;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        Ayalga Quick Trade
        <span class="version">v14</span>
    </h1>

    <div id="status" class="status">
        Conectando...
    </div>

    <div id="symbolBox" class="symbol-box">
        <div class="symbol-name" id="symbolName">
            Buscando símbolo...
        </div>

        <div class="symbol-id" id="symbolId">
            ID: -
        </div>
    </div>

    <div class="symbol-box">
        <strong>Símbolos recibidos</strong>

        <div id="symbols" class="symbols">
            Esperando...
        </div>
    </div>

    <div id="log"></div>

</div>


<script type="module">

import {
    createClientAdapter
} from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent
} from "https://esm.sh/@spotware-web-team/sdk";

import {
    take,
    tap,
    catchError
} from "https://esm.sh/rxjs";

import {
    createLogger
} from "https://esm.sh/@veksa/logger";


// ============================================================
// ELEMENTOS
// ============================================================

const statusElement = document.getElementById("status");
const symbolNameElement = document.getElementById("symbolName");
const symbolIdElement = document.getElementById("symbolId");
const symbolsElement = document.getElementById("symbols");
const logElement = document.getElementById("log");


// ============================================================
// LOG
// ============================================================

function log(message, type = "") {

    const time = new Date().toLocaleTimeString();

    const line = `[${time}] ${message}`;

    console.log(line);

    const div = document.createElement("div");

    div.textContent = line;

    if (type === "ok") {
        div.className = "connected";
    }

    if (type === "error") {
        div.className = "error";
    }

    if (type === "info") {
        div.className = "info";
    }

    logElement.appendChild(div);

    logElement.scrollTop = logElement.scrollHeight;
}


// ============================================================
// URL
// ============================================================

const params = new URLSearchParams(window.location.search);

const urlSymbol = params.get("symbol");
const platform = params.get("platform");
const placement = params.get("placement");
const theme = params.get("theme");

log("URL: " + window.location.href);

log("Símbolo recibido por URL: " + (urlSymbol || "ninguno"), "info");
log("Plataforma: " + (platform || "desconocida"), "info");
log("Placement: " + (placement || "desconocido"), "info");
log("Tema: " + (theme || "desconocido"), "info");


// ============================================================
// ADAPTER
// ============================================================

let adapter = null;


// ============================================================
// INICIALIZACIÓN
// ============================================================

function init() {

    try {

        log("Creando Client Adapter...");

        const logger = createLogger(
            location.href.includes("showLogs")
        );

        adapter = createClientAdapter({
            logger
        });

        log("Client Adapter creado correctamente.", "ok");


        // ====================================================
        // CONFIRMACIÓN
        // ====================================================

        log("Enviando confirmación...");

        handleConfirmEvent(adapter, {})
            .pipe(take(1))
            .subscribe({

                next: () => {
                    log("Confirmación recibida.", "ok");
                },

                error: (err) => {
                    log(
                        "Error en confirmación: " +
                        JSON.stringify(err),
                        "error"
                    );
                }

            });


        // ====================================================
        // REGISTER
        // ====================================================

        log("Registrando plugin...");

        registerEvent(adapter)
            .pipe(

                take(1),

                tap(() => {

                    log(
                        "Plugin registrado correctamente.",
                        "ok"
                    );

                    // Volvemos a confirmar exactamente
                    // como en el código que funcionaba.

                    handleConfirmEvent(adapter, {})
                        .pipe(take(1))
                        .subscribe();

                }),

                catchError(err => {

                    log(
                        "Error registrando plugin: " +
                        JSON.stringify(err),
                        "error"
                    );

                    statusElement.textContent =
                        "Error registrando plugin";

                    statusElement.classList.add("error");

                    return [];

                })

            )

            .subscribe({

                next: () => {

                    statusElement.textContent =
                        "CONECTADO";

                    statusElement.classList.add(
                        "connected"
                    );

                    log(
                        "Conexión establecida. Cargando símbolos...",
                        "ok"
                    );

                    loadSymbols();
                },

                error: (err) => {

                    statusElement.textContent =
                        "Error de conexión";

                    statusElement.classList.add(
                        "error"
                    );

                    log(
                        "Error final de registro: " +
                        JSON.stringify(err),
                        "error"
                    );

                }

            });

    }

    catch (err) {

        statusElement.textContent =
            "Error inicializando";

        statusElement.classList.add("error");

        log(
            "ERROR INICIALIZANDO: " +
            (err?.stack || err),
            "error"
        );

    }
}


// ============================================================
// CARGAR LISTA DE SÍMBOLOS
// ============================================================

function loadSymbols() {

    log("Solicitando lista de símbolos...");

    getLightSymbolList(adapter, {})
        .pipe(take(1))
        .subscribe({

            next: (response) => {

                log(
                    "Respuesta getLightSymbolList recibida.",
                    "ok"
                );


                // =================================================
                // MOSTRAMOS LAS CLAVES DE LA RESPUESTA
                // =================================================

                log(
                    "Claves de respuesta: " +
                    Object.keys(response || {}).join(", "),
                    "info"
                );


                // =================================================
                // AQUÍ ESTABA EL PROBLEMA
                //
                // La respuesta real es:
                //
                // response
                //    └── payload
                //          └── Symbol
                //
                // =================================================

                const symbols =
                    response?.payload?.Symbol ?? [];


                log(
                    "Cantidad de símbolos recibidos: " +
                    symbols.length,
                    "ok"
                );


                // =================================================
                // MOSTRAR SÍMBOLOS
                // =================================================

                symbolsElement.innerHTML = "";


                if (symbols.length === 0) {

                    symbolsElement.textContent =
                        "No se encontraron símbolos.";

                    log(
                        "La lista de símbolos está vacía.",
                        "error"
                    );

                    return;
                }


                symbols.forEach(symbol => {

                    const row =
                        document.createElement("div");

                    row.className = "symbol-row";


                    const name =
                        document.createElement("span");

                    name.textContent =
                        symbol?.Name ?? "SIN NOMBRE";


                    const id =
                        document.createElement("span");

                    id.className =
                        "symbol-id-small";

                    id.textContent =
                        "ID: " +
                        (symbol?.Id ?? "-");


                    row.appendChild(name);
                    row.appendChild(id);

                    symbolsElement.appendChild(row);

                });


                // =================================================
                // BUSCAR EL SÍMBOLO DE LA URL
                // =================================================

                if (urlSymbol) {

                    const found =
                        symbols.find(
                            s =>
                                String(s?.Name)
                                    .toUpperCase() ===
                                String(urlSymbol)
                                    .toUpperCase()
                        );


                    if (found) {

                        symbolNameElement.textContent =
                            found.Name;

                        symbolIdElement.textContent =
                            "ID: " + found.Id;


                        log(
                            "Símbolo encontrado: " +
                            found.Name +
                            " | ID: " +
                            found.Id,
                            "ok"
                        );


                        // =========================================
                        // CARGAR INFORMACIÓN DEL SÍMBOLO
                        // =========================================

                        loadSymbol(found.Id);

                    }

                    else {

                        symbolNameElement.textContent =
                            "Símbolo no encontrado";

                        symbolIdElement.textContent =
                            "ID: -";


                        log(
                            "No se encontró " +
                            urlSymbol +
                            " en la lista.",
                            "error"
                        );

                    }

                }

                else {

                    // Si no viene símbolo en URL,
                    // mostramos el primero.

                    const first =
                        symbols[0];

                    if (first) {

                        symbolNameElement.textContent =
                            first.Name;

                        symbolIdElement.textContent =
                            "ID: " + first.Id;

                    }

                }

            },

            error: (err) => {

                log(
                    "ERROR getLightSymbolList: " +
                    JSON.stringify(err),
                    "error"
                );

                symbolsElement.textContent =
                    "Error obteniendo símbolos.";

            }

        });

}


// ============================================================
// CARGAR SÍMBOLO
// ============================================================

function loadSymbol(symbolId) {

    log(
        "Solicitando información del símbolo ID " +
        symbolId +
        "..."
    );


    getSymbol(adapter, {
        symbolId: [symbolId]
    })
    .pipe(take(1))
    .subscribe({

        next: (response) => {

            log(
                "Respuesta getSymbol recibida.",
                "ok"
            );


            log(
                "Claves getSymbol: " +
                Object.keys(response || {}).join(", "),
                "info"
            );


            // Mostramos la respuesta completa
            // para conocer exactamente su estructura.

            log(
                "Respuesta getSymbol: " +
                JSON.stringify(response)
            );

        },

        error: (err) => {

            log(
                "ERROR getSymbol: " +
                JSON.stringify(err),
                "error"
            );

        }

    });

}


// ============================================================
// ARRANCAR
// ============================================================

init();

</script>

</body>
</html>
