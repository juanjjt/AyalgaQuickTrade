<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Ayalga Quick Trade v22</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .version {
            text-align: center;
            font-size: 12px;
            opacity: 0.65;
            margin-top: -8px;
            margin-bottom: 15px;
        }

        .card {
            background: #1b1b1b;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #2d2d2d;
        }

        .row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .row > * {
            flex: 1;
        }

        .label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .value {
            font-size: 15px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            height: 42px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #101010;
            color: white;
            padding: 0 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
        }

        .buy {
            background: #087f3f;
        }

        .sell {
            background: #a71919;
        }

        .rr {
            background: #303030;
            border: 1px solid #555;
            height: 46px;
            font-size: 16px;
        }

        .rr.active {
            background: #1769aa;
            border-color: #4da3ff;
        }

        .status {
            padding: 9px;
            border-radius: 8px;
            background: #252525;
            font-size: 13px;
            line-height: 1.4;
        }

        .status.ok {
            border-left: 4px solid #22aa66;
        }

        .status.error {
            border-left: 4px solid #dd3333;
        }

        .status.warning {
            border-left: 4px solid #e0a000;
        }

        .log {
            background: #090909;
            border: 1px solid #292929;
            border-radius: 8px;
            padding: 8px;
            height: 210px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .small {
            font-size: 11px;
            opacity: 0.65;
        }

        .green {
            color: #38d27d;
        }

        .red {
            color: #ff5555;
        }

        .yellow {
            color: #e7c64a;
        }

        .blue {
            color: #5da9ff;
        }

        .separator {
            height: 1px;
            background: #303030;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        Ayalga Quick Trade
    </div>

    <div class="version">
        v22
    </div>

    <div class="card">

        <div class="row">
            <div>
                <div class="label">Símbolo cTrader</div>
                <div class="value" id="symbol">Detectando...</div>
            </div>

            <div>
                <div class="label">Estado</div>
                <div class="value" id="connectionStatus">Conectando...</div>
            </div>
        </div>

        <div class="separator"></div>

        <div class="row">

            <div>
                <div class="label">Bid</div>
                <div class="value" id="bid">-</div>
            </div>

            <div>
                <div class="label">Ask</div>
                <div class="value" id="ask">-</div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="label">
            Número de velas cerradas para calcular SL
        </div>

        <input
            id="candleCount"
            type="number"
            min="1"
            max="1000"
            value="10"
        >

        <div style="height:10px;"></div>

        <div class="label">
            Timeframe para cálculo del SL
        </div>

        <select id="slTimeframe">

            <option value="1" selected>M1</option>
            <option value="2">M2</option>
            <option value="3">M3</option>
            <option value="4">M4</option>
            <option value="5">M5</option>
            <option value="6">M10</option>
            <option value="7">M15</option>
            <option value="8">M30</option>
            <option value="9">H1</option>
            <option value="10">H4</option>
            <option value="11">H12</option>
            <option value="12">D1</option>
            <option value="13">W1</option>
            <option value="14">MN1</option>

        </select>

    </div>


    <div class="card">

        <div class="label">
            Ratio Riesgo / Beneficio
        </div>

        <div class="row">

            <button
                id="rr11"
                class="rr active"
                type="button">
                RR 1:1
            </button>

            <button
                id="rr12"
                class="rr"
                type="button">
                RR 1:2
            </button>

        </div>

    </div>


    <div class="card">

        <div class="row">

            <button
                id="buyButton"
                class="buy"
                type="button">
                COMPRA
            </button>

            <button
                id="sellButton"
                class="sell"
                type="button">
                VENTA
            </button>

        </div>

    </div>


    <div class="card">

        <div class="row">

            <div>
                <div class="label">Volumen enviado</div>
                <div class="value" id="orderVolume">-</div>
            </div>

            <div>
                <div class="label">Min. volumen</div>
                <div class="value" id="minVolume">-</div>
            </div>

        </div>

        <div class="separator"></div>

        <div class="row">

            <div>
                <div class="label">Último SL</div>
                <div class="value" id="lastSL">-</div>
            </div>

            <div>
                <div class="label">Último TP</div>
                <div class="value" id="lastTP">-</div>
            </div>

        </div>

        <div class="separator"></div>

        <div>
            <div class="label">Position ID</div>
            <div class="value" id="positionId">-</div>
        </div>

        <div style="height:8px;"></div>

        <div>
            <div class="label">Entrada real cTrader</div>
            <div class="value" id="realEntry">-</div>
        </div>

    </div>


    <div class="card">

        <div
            id="status"
            class="status">
            Iniciando...
        </div>

    </div>


    <div class="card">

        <div class="label">
            Registro
        </div>

        <div
            id="log"
            class="log">
        </div>

    </div>

</div>


<script type="module">

import {
    createClientAdapter
} from "https://esm.sh/@spotware-web-team/sdk-external-api";

import {
    handleConfirmEvent,
    registerEvent,
    getLightSymbolList,
    getSymbol,
    subscribeQuotes,
    quoteEvent,
    executionEvent,
    createNewOrder,
    modifyOrderProtection,
    getTrendbarList,
    ServerInterfaces
} from "https://esm.sh/@spotware-web-team/sdk";

import {
    take,
    tap,
    catchError
} from "https://esm.sh/rxjs";

import {
    createLogger
} from "https://esm.sh/@veksa/logger";


// ============================================================
// CONFIGURACIÓN
// ============================================================

const VERSION = "v22";

const RETRY_DELAYS = [
    300,
    500,
    700,
    1000,
    1500
];

const MIN_TRENDBARS_REQUEST = 20;


// ============================================================
// VARIABLES GLOBALES
// ============================================================

let adapter = null;

let symbolInfo = null;

let symbolId = null;

let symbolName = null;

let lastValidBid = null;

let lastValidAsk = null;

let selectedRR = 1.0;

let pendingTrade = null;

let protectionSent = false;

let protectionInProgress = false;


// ============================================================
// LOGGER
// ============================================================

const logger = createLogger(
    location.href.includes("showLogs")
);


// ============================================================
// ELEMENTOS UI
// ============================================================

const symbolElement =
    document.getElementById("symbol");

const connectionStatusElement =
    document.getElementById("connectionStatus");

const bidElement =
    document.getElementById("bid");

const askElement =
    document.getElementById("ask");

const candleCountElement =
    document.getElementById("candleCount");

const slTimeframeElement =
    document.getElementById("slTimeframe");

const rr11Button =
    document.getElementById("rr11");

const rr12Button =
    document.getElementById("rr12");

const buyButton =
    document.getElementById("buyButton");

const sellButton =
    document.getElementById("sellButton");

const orderVolumeElement =
    document.getElementById("orderVolume");

const minVolumeElement =
    document.getElementById("minVolume");

const lastSLElement =
    document.getElementById("lastSL");

const lastTPElement =
    document.getElementById("lastTP");

const positionIdElement =
    document.getElementById("positionId");

const realEntryElement =
    document.getElementById("realEntry");

const statusElement =
    document.getElementById("status");

const logElement =
    document.getElementById("log");


// ============================================================
// LOG
// ============================================================

function log(message, type = "") {

    const now =
        new Date().toLocaleTimeString("es-ES");

    const line =
        `[${now}] ${message}`;

    const div =
        document.createElement("div");

    div.textContent = line;

    if (type === "ok") {
        div.className = "green";
    }

    if (type === "error") {
        div.className = "red";
    }

    if (type === "warning") {
        div.className = "yellow";
    }

    if (type === "info") {
        div.className = "blue";
    }

    logElement.appendChild(div);

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(line);
}


// ============================================================
// ESTADO
// ============================================================

function setStatus(
    message,
    type = ""
) {

    statusElement.textContent =
        message;

    statusElement.className =
        "status";

    if (type) {
        statusElement.classList.add(type);
    }
}


// ============================================================
// HELPERS DE RESPUESTAS
// ============================================================

function getField(
    object,
    ...names
) {

    if (!object) {
        return undefined;
    }

    for (const name of names) {

        if (
            object[name] !== undefined &&
            object[name] !== null
        ) {
            return object[name];
        }
    }

    return undefined;
}


function getPayload(response) {

    if (!response) {
        return null;
    }

    if (
        response.payload !== undefined &&
        response.payload !== null
    ) {
        return response.payload;
    }

    if (
        response.Payload !== undefined &&
        response.Payload !== null
    ) {
        return response.Payload;
    }

    return response;
}


function getArray(
    object,
    ...names
) {

    if (!object) {
        return [];
    }

    for (const name of names) {

        if (Array.isArray(object[name])) {
            return object[name];
        }
    }

    return [];
}


// ============================================================
// PRECIO
// ============================================================

function normalizePrice(price) {

    const numericPrice =
        Number(price);

    if (!Number.isFinite(numericPrice)) {
        return null;
    }

    const digits =
        Number(
            getField(
                symbolInfo,
                "digits",
                "Digits"
            ) ?? 5
        );

    const factor =
        Math.pow(10, digits);

    const normalized =
        Math.round(
            (numericPrice + Number.EPSILON) *
            factor
        ) / factor;

    return Number(
        normalized.toFixed(digits)
    );
}


function formatPrice(price) {

    const numericPrice =
        Number(price);

    if (!Number.isFinite(numericPrice)) {
        return "-";
    }

    const digits =
        Number(
            getField(
                symbolInfo,
                "digits",
                "Digits"
            ) ?? 5
        );

    return numericPrice.toFixed(digits);
}


// ============================================================
// TIMEFRAME
// ============================================================

function getTimeframeMinutes(
    period
) {

    switch (Number(period)) {

        case 1:
            return 1;

        case 2:
            return 2;

        case 3:
            return 3;

        case 4:
            return 4;

        case 5:
            return 5;

        case 6:
            return 10;

        case 7:
            return 15;

        case 8:
            return 30;

        case 9:
            return 60;

        case 10:
            return 240;

        case 11:
            return 720;

        case 12:
            return 1440;

        case 13:
            return 10080;

        case 14:
            return 43200;

        default:
            return 1;
    }
}


// ============================================================
// INICIO
// ============================================================

async function init() {

    log(
        `Ayalga Quick Trade ${VERSION}`,
        "info"
    );

    log(
        "Iniciando..."
    );

    try {

        adapter =
            createClientAdapter({
                logger
            });

    } catch (error) {

        log(
            `Error creando adapter: ${error}`,
            "error"
        );

        setStatus(
            "Error creando conexión",
            "error"
        );

        return;
    }


    // ========================================================
    // HANDSHAKE
    // ========================================================

    handleConfirmEvent(
        adapter,
        {}
    )
    .pipe(
        take(1)
    )
    .subscribe({
        error: error => {

            log(
                `Error handleConfirmEvent: ${JSON.stringify(error)}`,
                "error"
            );
        }
    });


    registerEvent(adapter)
    .pipe(

        take(1),

        tap(() => {

            log(
                "Plugin registrado correctamente.",
                "ok"
            );

            handleConfirmEvent(
                adapter,
                {}
            )
            .pipe(
                take(1)
            )
            .subscribe();

        }),

        catchError(error => {

            log(
                `Error registrando plugin: ${JSON.stringify(error)}`,
                "error"
            );

            setStatus(
                "Error de registro",
                "error"
            );

            return [];

        })

    )
    .subscribe({

        next: () => {

            connectionStatusElement.textContent =
                "CONECTADO";

            setStatus(
                "Conectado a cTrader",
                "ok"
            );

            subscribeExecutionEvents();

            subscribeQuoteEvents();

            loadSymbols();
        },

        error: error => {

            log(
                `Error registro: ${JSON.stringify(error)}`,
                "error"
            );

            connectionStatusElement.textContent =
                "ERROR";

        }

    });

}


// ============================================================
// EXECUTION EVENT
// ============================================================

function subscribeExecutionEvents() {

    log(
        "Suscribiendo executionEvent..."
    );

    executionEvent(adapter)
    .subscribe({

        next: event => {

            processExecutionEvent(
                event
            );

        },

        error: error => {

            log(
                `Error executionEvent: ${JSON.stringify(error)}`,
                "error"
            );

        }

    });

    log(
        "executionEvent suscrito correctamente.",
        "ok"
    );
}


// ============================================================
// QUOTE EVENT
// ============================================================

function subscribeQuoteEvents() {

    log(
        "Suscribiendo quoteEvent..."
    );

    quoteEvent(adapter)
    .subscribe({

        next: event => {

            processQuoteEvent(
                event
            );

        },

        error: error => {

            log(
                `Error quoteEvent: ${JSON.stringify(error)}`,
                "error"
            );

        }

    });

    log(
        "quoteEvent suscrito correctamente.",
        "ok"
    );
}


// ============================================================
// CARGAR SÍMBOLOS
// ============================================================

function loadSymbols() {

    log(
        "Buscando símbolos en cTrader..."
    );

    getLightSymbolList(
        adapter,
        {}
    )
    .pipe(
        take(1)
    )
    .subscribe({

        next: response => {

            try {

                const payload =
                    getPayload(response);

                const symbols =
                    getArray(
                        payload,
                        "Symbol",
                        "symbol",
                        "Symbols",
                        "symbols"
                    );

                log(
                    `Símbolos recibidos: ${symbols.length}`
                );

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );

                const requestedSymbol =
                    urlParams.get("symbol");

                let found = null;


                if (requestedSymbol) {

                    found =
                        symbols.find(
                            item =>
                                String(
                                    getField(
                                        item,
                                        "Name",
                                        "name"
                                    )
                                ).toUpperCase()
                                ===
                                requestedSymbol.toUpperCase()
                        );
                }


                if (!found) {

                    found =
                        symbols.find(
                            item =>
                                String(
                                    getField(
                                        item,
                                        "Name",
                                        "name"
                                    )
                                ).toUpperCase()
                                === "EURUSD"
                        );

                }


                if (!found) {

                    log(
                        "No se encontró el símbolo solicitado.",
                        "error"
                    );

                    setStatus(
                        "Símbolo no encontrado",
                        "error"
                    );

                    return;
                }


                symbolId =
                    Number(
                        getField(
                            found,
                            "Id",
                            "id"
                        )
                    );


                symbolName =
                    getField(
                        found,
                        "Name",
                        "name"
                    );


                symbolElement.textContent =
                    `${symbolName} (ID ${symbolId})`;


                log(
                    `Símbolo detectado: ${symbolName} (ID ${symbolId})`,
                    "ok"
                );


                loadDetailedSymbol();

            } catch (error) {

                log(
                    `Error procesando símbolos: ${error}`,
                    "error"
                );

            }

        },

        error: error => {

            log(
                `Error obteniendo símbolos: ${JSON.stringify(error)}`,
                "error"
            );

        }

    });
}


// ============================================================
// INFORMACIÓN DETALLADA DEL SÍMBOLO
// ============================================================

function loadDetailedSymbol() {

    log(
        "Obteniendo información detallada de cTrader..."
    );

    getSymbol(
        adapter,
        {
            symbolId: [
                symbolId
            ]
        }
    )
    .pipe(
        take(1)
    )
    .subscribe({

        next: response => {

            try {

                const payload =
                    getPayload(response);

                let info = payload;


                if (
                    Array.isArray(payload)
                ) {
                    info = payload[0];
                }


                if (
                    payload &&
                    Array.isArray(payload.Symbol)
                ) {
                    info =
                        payload.Symbol[0];
                }


                if (
                    payload &&
                    Array.isArray(payload.symbol)
                ) {
                    info =
                        payload.symbol[0];
                }


                symbolInfo =
                    info;


                const minVolume =
                    getField(
                        symbolInfo,
                        "minVolume",
                        "MinVolume"
                    );

                const stepVolume =
                    getField(
                        symbolInfo,
                        "stepVolume",
                        "StepVolume"
                    );

                const maxVolume =
                    getField(
                        symbolInfo,
                        "maxVolume",
                        "MaxVolume"
                    );

                const digits =
                    getField(
                        symbolInfo,
                        "digits",
                        "Digits"
                    );

                const pipPosition =
                    getField(
                        symbolInfo,
                        "pipPosition",
                        "PipPosition"
                    );


                log(
                    `minVolume cTrader: ${minVolume}`
                );

                log(
                    `stepVolume cTrader: ${stepVolume}`
                );

                log(
                    `maxVolume cTrader: ${maxVolume}`
                );

                log(
                    `digits: ${digits}`
                );

                log(
                    `pipPosition: ${pipPosition}`
                );


                minVolumeElement.textContent =
                    minVolume ?? "-";

                orderVolumeElement.textContent =
                    minVolume ?? "-";


                log(
                    "Información detallada recibida.",
                    "ok"
                );


                subscribeToSymbol();

            } catch (error) {

                log(
                    `Error información símbolo: ${error}`,
                    "error"
                );

            }

        },

        error: error => {

            log(
                `Error getSymbol: ${JSON.stringify(error)}`,
                "error"
            );

        }

    });
}


// ============================================================
// SUSCRIBIR PRECIOS
// ============================================================

function subscribeToSymbol() {

    subscribeQuotes(
        adapter,
        {
            symbolId: [
                symbolId
            ]
        }
    )
    .pipe(
        take(1)
    )
    .subscribe({

        next: () => {

            log(
                "Suscripción de precios activa.",
                "ok"
            );

        },

        error: error => {

            log(
                `Error suscribiendo precios: ${JSON.stringify(error)}`,
                "error"
            );

        }

    });

}


// ============================================================
// PROCESAR QUOTE
// ============================================================

function processQuoteEvent(
    event
) {

    if (!event) {
        return;
    }

    const payload =
        getPayload(event);

    const eventSymbolId =
        Number(
            getField(
                payload,
                "SymbolId",
                "symbolId"
            )
        );


    if (
        Number.isFinite(eventSymbolId) &&
        symbolId !== null &&
        eventSymbolId !== symbolId
    ) {
        return;
    }


    const bidRaw =
        getField(
            payload,
            "Bid",
            "bid"
        );

    const askRaw =
        getField(
            payload,
            "Ask",
            "ask"
        );


    const bid =
        convertQuotePrice(
            bidRaw
        );

    const ask =
        convertQuotePrice(
            askRaw
        );


    if (
        Number.isFinite(bid) &&
        bid > 0
    ) {
        lastValidBid =
            bid;

        bidElement.textContent =
            formatPrice(bid);
    }


    if (
        Number.isFinite(ask) &&
        ask > 0
    ) {
        lastValidAsk =
            ask;

        askElement.textContent =
            formatPrice(ask);
    }

}


// ============================================================
// CONVERSIÓN DE QUOTE
// ============================================================

function convertQuotePrice(
    value
) {

    if (
        value === undefined ||
        value === null
    ) {
        return null;
    }

    const numeric =
        Number(value);

    if (!Number.isFinite(numeric)) {
        return null;
    }

    if (numeric <= 0) {
        return null;
    }


    /*
       cTrader puede entregar el precio
       en formato entero protobuf.

       Para EURUSD 1.15386:

       115386 -> 1.15386
    */

    if (numeric > 100) {
        return numeric / 100000;
    }


    return numeric;
}


// ============================================================
// OBTENER VELAS CERRADAS
// ============================================================

function getClosedTrendbars(
    period,
    count
) {

    return new Promise(
        (resolve, reject) => {

            const timeframeMinutes =
                getTimeframeMinutes(
                    period
                );


            const now =
                Date.now();


            const currentBarStart =
                Math.floor(
                    now /
                    (
                        timeframeMinutes *
                        60 *
                        1000
                    )
                ) *
                timeframeMinutes *
                60 *
                1000;


            const extraBars =
                Math.max(
                    count + 5,
                    MIN_TRENDBARS_REQUEST
                );


            const fromTimestamp =
                Math.floor(
                    (
                        currentBarStart -
                        (
                            extraBars +
                            10
                        ) *
                        timeframeMinutes *
                        60 *
                        1000
                    ) / 1000
                );


            const toTimestamp =
                Math.floor(
                    now / 1000
                );


            log(
                `Solicitando ${extraBars} velas al servidor cTrader...`
            );


            getTrendbarList(
                adapter,
                {
                    symbolId: symbolId,
                    period: Number(period),
                    fromTimestamp: fromTimestamp,
                    toTimestamp: toTimestamp,
                    count: extraBars,
                    type:
                        ServerInterfaces
                        .ProtoTrendbarType
                        .REGULAR_OHLC
                }
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: response => {

                    try {

                        const payload =
                            getPayload(response);

                        let bars =
                            getArray(
                                payload,
                                "Trendbar",
                                "trendbar",
                                "Trendbars",
                                "trendbars"
                            );


                        if (
                            bars.length === 0 &&
                            Array.isArray(payload)
                        ) {
                            bars = payload;
                        }


                        const closedBars =
                            bars
                            .map(
                                bar =>
                                    normalizeTrendbar(
                                        bar
                                    )
                            )
                            .filter(
                                bar =>
                                    bar &&
                                    Number.isFinite(
                                        bar.startTimestamp
                                    ) &&
                                    bar.startTimestamp <
                                    currentBarStart
                            )
                            .sort(
                                (
                                    a,
                                    b
                                ) =>
                                    a.startTimestamp -
                                    b.startTimestamp
                            );


                        const selected =
                            closedBars.slice(
                                -count
                            );


                        log(
                            `Velas cerradas válidas: ${selected.length}`
                        );


                        if (
                            selected.length <
                            count
                        ) {

                            reject(
                                new Error(
                                    `cTrader solo devolvió ${selected.length} velas cerradas de ${count} solicitadas.`
                                )
                            );

                            return;
                        }


                        resolve(
                            selected
                        );

                    } catch (error) {

                        reject(error);

                    }

                },

                error: error => {

                    reject(error);

                }

            });

        }
    );

}


// ============================================================
// NORMALIZAR TREND BAR
// ============================================================

function normalizeTrendbar(
    bar
) {

    if (!bar) {
        return null;
    }


    const lowRaw =
        getField(
            bar,
            "low",
            "Low"
        );


    const deltaOpen =
        getField(
            bar,
            "deltaOpen",
            "DeltaOpen"
        );


    const deltaClose =
        getField(
            bar,
            "deltaClose",
            "DeltaClose"
        );


    const deltaHigh =
        getField(
            bar,
            "deltaHigh",
            "DeltaHigh"
        );


    const timestampMinutes =
        getField(
            bar,
            "utcTimestampInMinutes",
            "UtcTimestampInMinutes"
        );


    if (
        lowRaw === undefined ||
        timestampMinutes === undefined
    ) {
        return null;
    }


    const low =
        Number(lowRaw) / 100000;


    const open =
        low +
        Number(deltaOpen ?? 0) /
        100000;


    const close =
        low +
        Number(deltaClose ?? 0) /
        100000;


    const high =
        low +
        Number(deltaHigh ?? 0) /
        100000;


    const startTimestamp =
        Number(timestampMinutes) *
        60 *
        1000;


    return {
        low,
        open,
        close,
        high,
        startTimestamp
    };

}


// ============================================================
// CALCULAR SL
// ============================================================

async function calculateSL(
    side
) {

    const count =
        Math.max(
            1,
            Number(
                candleCountElement.value
            ) || 10
        );


    const period =
        Number(
            slTimeframeElement.value
        ) || 1;


    log(
        `${side}: calculando SL con ${count} velas cerradas...`,
        "info"
    );

    log(
        `Timeframe SL: ${getTimeframeName(period)}`
    );


    const bars =
        await getClosedTrendbars(
            period,
            count
        );


    if (
        !bars ||
        bars.length === 0
    ) {
        throw new Error(
            "No se pudieron obtener velas cerradas."
        );
    }


    let sl;


    if (side === "BUY") {

        sl =
            Math.min(
                ...bars.map(
                    bar => bar.low
                )
            );

        log(
            `BUY SL calculado por cTrader: ${formatPrice(sl)}`,
            "ok"
        );

    } else {

        sl =
            Math.max(
                ...bars.map(
                    bar => bar.high
                )
            );

        log(
            `SELL SL calculado por cTrader: ${formatPrice(sl)}`,
            "ok"
        );

    }


    return normalizePrice(sl);

}


// ============================================================
// NOMBRE TIMEFRAME
// ============================================================

function getTimeframeName(
    period
) {

    switch (Number(period)) {

        case 1:
            return "M1";

        case 2:
            return "M2";

        case 3:
            return "M3";

        case 4:
            return "M4";

        case 5:
            return "M5";

        case 6:
            return "M10";

        case 7:
            return "M15";

        case 8:
            return "M30";

        case 9:
            return "H1";

        case 10:
            return "H4";

        case 11:
            return "H12";

        case 12:
            return "D1";

        case 13:
            return "W1";

        case 14:
            return "MN1";

        default:
            return "?";
    }

}


// ============================================================
// EJECUTAR TRADE
// ============================================================

async function executeTrade(
    side
) {

    if (!adapter) {

        setStatus(
            "cTrader no está conectado",
            "error"
        );

        return;
    }


    if (!symbolId) {

        setStatus(
            "Símbolo todavía no disponible",
            "error"
        );

        return;
    }


    if (pendingTrade) {

        log(
            "Ya existe una operación pendiente de procesamiento.",
            "warning"
        );

        setStatus(
            "Esperando operación anterior...",
            "warning"
        );

        return;
    }


    protectionSent = false;

    protectionInProgress = false;


    try {

        setStatus(
            `${side}: calculando SL...`,
            "warning"
        );


        const sl =
            await calculateSL(
                side
            );


        if (!Number.isFinite(sl)) {

            throw new Error(
                "SL calculado no válido."
            );
        }


        const minVolume =
            Number(
                getField(
                    symbolInfo,
                    "minVolume",
                    "MinVolume"
                )
            );


        if (
            !Number.isFinite(
                minVolume
            ) ||
            minVolume <= 0
        ) {

            throw new Error(
                "No se pudo obtener minVolume de cTrader."
            );
        }


        orderVolumeElement.textContent =
            minVolume;


        log(
            `Enviando MARKET con volumen mínimo: ${minVolume}`,
            "info"
        );


        pendingTrade = {

            side,

            sl,

            rr: selectedRR,

            orderId: null,

            positionId: null,

            realEntry: null,

            tp: null,

            protectionAttempts: 0,

            protectionTimer: null

        };


        setStatus(
            `${side}: enviando orden MARKET...`,
            "warning"
        );


        const result =
            await createMarketOrder(
                side,
                minVolume
            );


        processOrderResponse(
            result
        );


    } catch (error) {

        log(
            `${side}: ERROR: ${error?.message ?? error}`,
            "error"
        );

        setStatus(
            `Error ${side}`,
            "error"
        );

        pendingTrade = null;
    }

}


// ============================================================
// CREATE MARKET ORDER
// ============================================================

function createMarketOrder(
    side,
    volume
) {

    return new Promise(
        (resolve, reject) => {

            createNewOrder(
                adapter,
                {
                    symbolId: symbolId,

                    orderType:
                        ServerInterfaces
                        .ProtoOrderType
                        .MARKET,

                    tradeSide:
                        side === "BUY"
                            ? ServerInterfaces
                                .ProtoTradeSide
                                .BUY
                            : ServerInterfaces
                                .ProtoTradeSide
                                .SELL,

                    volume: volume,

                    clientOrderId:
                        `AQT_${Date.now()}`
                }
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: response => {

                    log(
                        `RESPUESTA createNewOrder: ${safeStringify(response)}`
                    );

                    resolve(
                        response
                    );

                },

                error: error => {

                    reject(error);

                }

            });

        }
    );

}


// ============================================================
// RESPUESTA CREATE ORDER
// ============================================================

function processOrderResponse(
    response
) {

    if (!pendingTrade) {
        return;
    }


    const payload =
        getPayload(response);


    const executionType =
        getField(
            payload,
            "ExecutionType",
            "executionType"
        );


    const position =
        getField(
            payload,
            "Position",
            "position"
        );


    const order =
        getField(
            payload,
            "Order",
            "order"
        );


    const positionId =
        getField(
            position,
            "PositionId",
            "positionId"
        );


    const orderId =
        getField(
            order,
            "OrderId",
            "orderId"
        );


    if (
        positionId !== undefined &&
        positionId !== null
    ) {

        pendingTrade.positionId =
            Number(positionId);

        positionIdElement.textContent =
            String(positionId);

        log(
            `Position ID recibido: ${positionId}`,
            "ok"
        );
    }


    if (
        orderId !== undefined &&
        orderId !== null
    ) {

        pendingTrade.orderId =
            Number(orderId);

        log(
            `Order ID: ${orderId}`
        );
    }


    if (executionType) {

        log(
            `ExecutionType recibido: ${executionType}`
        );

    }


    if (
        String(
            executionType
        ).toUpperCase()
        === "ORDER_REJECTED"
    ) {

        log(
            "❌ cTrader rechazó la orden.",
            "error"
        );

        pendingTrade = null;

        setStatus(
            "Orden rechazada",
            "error"
        );
    }

}


// ============================================================
// PROCESAR EXECUTION EVENT
// ============================================================

function processExecutionEvent(
    event
) {

    if (!event) {
        return;
    }


    log(
        `EXECUTION EVENT: ${safeStringify(event)}`
    );


    const payload =
        getPayload(event);


    const executionType =
        String(
            getField(
                payload,
                "ExecutionType",
                "executionType"
            ) ?? ""
        ).toUpperCase();


    if (!executionType) {
        return;
    }


    log(
        `ExecutionType: ${executionType}`
    );


    // ========================================================
    // ACCEPTED
    // ========================================================

    if (
        executionType ===
        "ORDER_ACCEPTED"
    ) {

        processOrderResponse(
            event
        );

        log(
            "cTrader respondió a la orden.",
            "ok"
        );

        return;
    }


    // ========================================================
    // REJECTED
    // ========================================================

    if (
        executionType ===
        "ORDER_REJECTED"
    ) {

        log(
            "❌ ORDER_REJECTED",
            "error"
        );

        log(
            safeStringify(event),
            "error"
        );

        pendingTrade = null;

        setStatus(
            "Orden rechazada",
            "error"
        );

        return;
    }


    // ========================================================
    // FILLED
    // ========================================================

    if (
        executionType ===
        "ORDER_FILLED"
    ) {

        handleFilledExecution(
            event
        );

        return;
    }


    // ========================================================
    // PARTIAL FILL
    // ========================================================

    if (
        executionType ===
        "ORDER_PARTIAL_FILL"
    ) {

        log(
            "ORDER_PARTIAL_FILL recibido.",
            "warning"
        );

        handleFilledExecution(
            event
        );

        return;
    }


    // ========================================================
    // ORDER REPLACED
    // ========================================================

    if (
        executionType ===
        "ORDER_REPLACED"
    ) {

        log(
            "✅ ORDER_REPLACED recibido por cTrader.",
            "ok"
        );


        /*
           IMPORTANTE:

           Solo aquí consideramos que SL/TP
           han sido realmente aceptados.

           No antes.
        */

        protectionSent = true;

        protectionInProgress = false;


        if (pendingTrade) {

            lastSLElement.textContent =
                formatPrice(
                    pendingTrade.sl
                );

            lastTPElement.textContent =
                formatPrice(
                    pendingTrade.tp
                );

        }


        setStatus(
            "SL + TP colocados correctamente",
            "ok"
        );


        log(
            "🛡️ PROTECCIÓN CONFIRMADA POR cTRADER.",
            "ok"
        );


        return;
    }

}


// ============================================================
// ORDER FILLED
// ============================================================

function handleFilledExecution(
    event
) {

    if (!pendingTrade) {

        log(
            "ORDER_FILLED recibido pero no hay pendingTrade.",
            "warning"
        );

        return;
    }


    const payload =
        getPayload(event);


    const position =
        getField(
            payload,
            "Position",
            "position"
        );


    const order =
        getField(
            payload,
            "Order",
            "order"
        );


    const deal =
        getField(
            payload,
            "Deal",
            "deal"
        );


    // ========================================================
    // POSITION ID
    // ========================================================

    const positionIdRaw =
        getField(
            position,
            "PositionId",
            "positionId"
        )
        ??
        getField(
            order,
            "PositionId",
            "positionId"
        )
        ??
        getField(
            deal,
            "PositionId",
            "positionId"
        )
        ??
        pendingTrade.positionId;


    const positionId =
        Number(
            positionIdRaw
        );


    if (
        !Number.isFinite(positionId) ||
        positionId <= 0
    ) {

        log(
            "❌ No se pudo obtener un PositionId válido.",
            "error"
        );

        return;
    }


    pendingTrade.positionId =
        positionId;


    positionIdElement.textContent =
        String(positionId);


    // ========================================================
    // PRECIO REAL DE ENTRADA
    // ========================================================

    const positionPrice =
        getField(
            position,
            "Price",
            "price"
        );


    const dealExecutionPrice =
        getField(
            deal,
            "ExecutionPrice",
            "executionPrice"
        );


    const orderExecutionPrice =
        getField(
            order,
            "ExecutionPrice",
            "executionPrice"
        );


    let realEntry =
        Number(
            positionPrice
        );


    if (
        !Number.isFinite(realEntry) ||
        realEntry <= 0
    ) {

        realEntry =
            Number(
                dealExecutionPrice
            );
    }


    if (
        !Number.isFinite(realEntry) ||
        realEntry <= 0
    ) {

        realEntry =
            Number(
                orderExecutionPrice
            );
    }


    if (
        !Number.isFinite(realEntry) ||
        realEntry <= 0
    ) {

        log(
            "❌ No se pudo obtener el precio REAL de ejecución.",
            "error"
        );

        return;
    }


    realEntry =
        normalizePrice(
            realEntry
        );


    pendingTrade.realEntry =
        realEntry;


    realEntryElement.textContent =
        formatPrice(realEntry);


    log(
        "================================",
        "info"
    );

    log(
        "✅ ORDER_FILLED RECIBIDO",
        "ok"
    );

    log(
        "================================",
        "info"
    );

    log(
        `Position ID REAL: ${positionId}`,
        "ok"
    );

    log(
        `Entrada REAL cTrader: ${formatPrice(realEntry)}`,
        "ok"
    );


    // ========================================================
    // VALIDAR SL
    // ========================================================

    const sl =
        normalizePrice(
            pendingTrade.sl
        );


    if (!Number.isFinite(sl)) {

        log(
            "❌ SL inválido.",
            "error"
        );

        return;
    }


    if (
        pendingTrade.side === "BUY" &&
        sl >= realEntry
    ) {

        log(
            `❌ BUY rechazado: SL ${formatPrice(sl)} no está por debajo de entrada ${formatPrice(realEntry)}.`,
            "error"
        );

        setStatus(
            "SL incorrecto para BUY",
            "error"
        );

        pendingTrade = null;

        return;
    }


    if (
        pendingTrade.side === "SELL" &&
        sl <= realEntry
    ) {

        log(
            `❌ SELL rechazado: SL ${formatPrice(sl)} no está por encima de entrada ${formatPrice(realEntry)}.`,
            "error"
        );

        setStatus(
            "SL incorrecto para SELL",
            "error"
        );

        pendingTrade = null;

        return;
    }


    pendingTrade.sl =
        sl;


    // ========================================================
    // DISTANCIA SL
    // ========================================================

    const slDistance =
        Math.abs(
            realEntry -
            sl
        );


    if (
        !Number.isFinite(slDistance) ||
        slDistance <= 0
    ) {

        log(
            "❌ Distancia SL inválida.",
            "error"
        );

        return;
    }


    log(
        `Distancia SL: ${slDistance}`
    );


    // ========================================================
    // TP SEGÚN RR
    // ========================================================

    let tp;


    if (
        pendingTrade.side === "BUY"
    ) {

        tp =
            realEntry +
            slDistance *
            pendingTrade.rr;

    } else {

        tp =
            realEntry -
            slDistance *
            pendingTrade.rr;

    }


    tp =
        normalizePrice(
            tp
        );


    pendingTrade.tp =
        tp;


    log(
        `TP RR ${pendingTrade.rr === 1 ? "1:1" : "1:2"}: ${formatPrice(tp)}`
    );


    lastSLElement.textContent =
        formatPrice(sl);

    lastTPElement.textContent =
        formatPrice(tp);


    // ========================================================
    // NUEVO CONTROL DE PROTECCIÓN
    // ========================================================

    protectionSent = false;

    protectionInProgress = false;


    /*
       IMPORTANTE:

       No enviamos el modify inmediatamente.

       Esperamos 300 ms después de ORDER_FILLED.

       El PositionId sigue siendo NUMÉRICO.
       NO añadimos "PID".
    */

    log(
        "Esperando 300 ms antes de enviar SL + TP...",
        "warning"
    );


    setStatus(
        "Orden ejecutada. Colocando SL + TP...",
        "warning"
    );


    scheduleProtectionRetry(
        0
    );

}


// ============================================================
// PROGRAMAR PROTECCIÓN
// ============================================================

function scheduleProtectionRetry(
    attempt
) {

    if (!pendingTrade) {
        return;
    }


    if (protectionSent) {
        return;
    }


    const delay =
        RETRY_DELAYS[
            Math.min(
                attempt,
                RETRY_DELAYS.length - 1
            )
        ];


    pendingTrade.protectionAttempts =
        attempt;


    log(
        `Intento de protección #${attempt + 1} programado en ${delay} ms.`,
        "warning"
    );


    if (
        pendingTrade.protectionTimer
    ) {

        clearTimeout(
            pendingTrade.protectionTimer
        );

    }


    pendingTrade.protectionTimer =
        setTimeout(
            () => {

                sendProtection(
                    attempt
                );

            },
            delay
        );

}


// ============================================================
// ENVIAR SL + TP
// ============================================================

function sendProtection(
    attempt
) {

    if (!pendingTrade) {
        return;
    }


    if (protectionSent) {
        return;
    }


    if (protectionInProgress) {
        return;
    }


    protectionInProgress =
        true;


    const positionId =
        Number(
            pendingTrade.positionId
        );


    const finalSL =
        normalizePrice(
            pendingTrade.sl
        );


    const finalTP =
        normalizePrice(
            pendingTrade.tp
        );


    if (
        !Number.isFinite(positionId) ||
        positionId <= 0
    ) {

        protectionInProgress =
            false;

        log(
            "❌ PositionId inválido para protección.",
            "error"
        );

        return;
    }


    if (
        !Number.isFinite(finalSL) ||
        !Number.isFinite(finalTP)
    ) {

        protectionInProgress =
            false;

        log(
            "❌ SL o TP inválido para protección.",
            "error"
        );

        return;
    }


    log(
        "================================",
        "info"
    );

    log(
        "🛡️ ENVIANDO SL + TP A cTRADER",
        "info"
    );

    log(
        "================================",
        "info"
    );


    log(
        `Intento: ${attempt + 1}/${RETRY_DELAYS.length}`
    );

    log(
        `Entrada REAL cTrader: ${formatPrice(pendingTrade.realEntry)}`
    );

    log(
        `Distancia SL: ${Math.abs(pendingTrade.realEntry - finalSL)}`
    );

    log(
        `SL NORMALIZADO: ${formatPrice(finalSL)}`
    );

    log(
        `TP NORMALIZADO: ${formatPrice(finalTP)}`
    );

    log(
        `Position ID REAL: ${positionId}`,
        "ok"
    );


    /*
       AQUÍ está la comprobación importante:

       Enviamos SOLO el número.

       NO:
       "PID59106683"

       SÍ:
       59106683
    */

    const protectionPayload = {

        positionId:
            positionId,

        stopLoss:
            finalSL,

        takeProfit:
            finalTP

    };


    log(
        `PAYLOAD SL/TP ENVIADO: ${safeStringify(protectionPayload)}`
    );


    modifyOrderProtection(
        adapter,
        protectionPayload
    )
    .pipe(
        take(1)
    )
    .subscribe({

        next: response => {

            protectionInProgress =
                false;


            log(
                `RESPUESTA modifyOrderProtection: ${safeStringify(response)}`
            );


            const payload =
                getPayload(response);


            const executionType =
                String(
                    getField(
                        payload,
                        "ExecutionType",
                        "executionType"
                    ) ?? ""
                ).toUpperCase();


            const errorCode =
                String(
                    getField(
                        payload,
                        "ErrorCode",
                        "errorCode"
                    ) ?? ""
                ).toUpperCase();


            const description =
                getField(
                    payload,
                    "Description",
                    "description"
                );


            // ====================================================
            // ERROR POSITION_NOT_FOUND
            // ====================================================

            if (
                errorCode ===
                "POSITION_NOT_FOUND"
            ) {

                log(
                    `⚠️ cTrader responde POSITION_NOT_FOUND en intento ${attempt + 1}.`,
                    "warning"
                );

                log(
                    `Descripción: ${description ?? "-"}`,
                    "warning"
                );


                if (
                    attempt + 1 <
                    RETRY_DELAYS.length
                ) {

                    log(
                        "La orden existe, pero cTrader todavía no acepta la modificación. Reintentando...",
                        "warning"
                    );


                    scheduleProtectionRetry(
                        attempt + 1
                    );

                    return;
                }


                log(
                    "❌ Se agotaron todos los intentos de protección.",
                    "error"
                );


                setStatus(
                    "No se pudo colocar SL + TP",
                    "error"
                );


                return;
            }


            // ====================================================
            // OTRO ERROR
            // ====================================================

            if (
                errorCode
            ) {

                log(
                    `❌ Error cTrader: ${errorCode}`,
                    "error"
                );

                log(
                    `Respuesta servidor: ${description ?? safeStringify(payload)}`,
                    "error"
                );


                setStatus(
                    `Error protección: ${errorCode}`,
                    "error"
                );


                return;
            }


            // ====================================================
            // ORDER_REPLACED
            // ====================================================

            if (
                executionType ===
                "ORDER_REPLACED"
            ) {

                protectionSent =
                    true;

                log(
                    "✅ SL + TP aceptados por cTrader.",
                    "ok"
                );

                setStatus(
                    "SL + TP colocados correctamente",
                    "ok"
                );


                return;
            }


            /*
               Si la respuesta no trae ExecutionType
               pero tampoco trae ErrorCode, no damos
               por confirmada la protección todavía.

               Esperamos el ORDER_REPLACED por
               executionEvent.
            */

            log(
                "Respuesta recibida. Esperando confirmación ORDER_REPLACED...",
                "warning"
            );

        },

        error: error => {

            protectionInProgress =
                false;


            log(
                `Error observable modifyOrderProtection: ${safeStringify(error)}`,
                "error"
            );


            /*
               Un error de transporte no debe hacer
               automáticamente otra orden.

               Pero sí podemos volver a intentar
               la protección sobre EL MISMO PositionId.
            */

            if (
                attempt + 1 <
                RETRY_DELAYS.length
            ) {

                log(
                    "Reintentando protección sobre la MISMA posición...",
                    "warning"
                );


                scheduleProtectionRetry(
                    attempt + 1
                );

            } else {

                log(
                    "❌ Se agotaron los reintentos de protección.",
                    "error"
                );

                setStatus(
                    "Error colocando SL + TP",
                    "error"
                );

            }

        }

    });

}

// ============================================================

// ============================================================

function safeStringify(
    value
) {

    try {

        return JSON.stringify(
            value,
            null,
            2
        );

    } catch {

        return String(value);

    }

}
