<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Ayalga Quick Trade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111111;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 18px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 30px;
            line-height: 1.1;
        }

        .version {
            color: #888888;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        .status {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #252525;
            color: #f0c933;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .status.connected {
            color: #39d353;
        }

        .status.error {
            color: #ff4d4d;
        }

        .info {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: #1d1d1d;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #999999;
            font-size: 15px;
        }

        .value {
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
        }

        .price {
            font-size: 24px;
            font-weight: 700;
        }

        .log-title {
            color: #999999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .log {
            width: 100%;
            min-height: 250px;
            padding: 14px;
            border-radius: 10px;
            background: #050505;
            color: #eeeeee;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ayalga Quick Trade</h1>

    <div class="version">
        V0.8 — Símbolo + BID/ASK
    </div>

    <div id="status" class="status">
        Inicializando...
    </div>

    <div class="info">

        <div class="info-row">
            <span class="label">Plataforma</span>
            <span id="platform" class="value">-</span>
        </div>

        <div class="info-row">
            <span class="label">Símbolo</span>
            <span id="symbol" class="value">-</span>
        </div>

        <div class="info-row">
            <span class="label">BID</span>
            <span id="bid" class="value price">-</span>
        </div>

        <div class="info-row">
            <span class="label">ASK</span>
            <span id="ask" class="value price">-</span>
        </div>

    </div>

    <div class="log-title">
        Registro
    </div>

    <div id="log" class="log"></div>

</div>


<script type="module">

    /* ============================================================
       IMPORTS
       ============================================================ */

    import {
        createClientAdapter
    } from "https://esm.sh/@spotware-web-team/sdk-external-api";


    import {
        handleConfirmEvent,
        registerEvent,
        getLightSymbolList,
        getSymbol,
        subscribeQuotes,
        quoteEvent
    } from "https://esm.sh/@spotware-web-team/sdk";


    import {
        take,
        catchError
    } from "https://esm.sh/rxjs";


    import {
        createLogger
    } from "https://esm.sh/@veksa/logger";


    /* ============================================================
       VARIABLES
       ============================================================ */

    let adapter = null;

    let connected = false;

    let currentSymbolName = null;

    let currentSymbolId = null;

    let currentSymbolDigits = 5;

    let quoteSubscription = null;


    /* ============================================================
       ELEMENTOS
       ============================================================ */

    const statusElement =
        document.getElementById("status");

    const platformElement =
        document.getElementById("platform");

    const symbolElement =
        document.getElementById("symbol");

    const bidElement =
        document.getElementById("bid");

    const askElement =
        document.getElementById("ask");

    const logElement =
        document.getElementById("log");


    /* ============================================================
       LOG
       ============================================================ */

    function log(message) {

        const now = new Date();

        const time =
            now.toLocaleTimeString(
                "es-ES",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

        const text =
            "[" + time + "] " + message;

        console.log(text);

        logElement.textContent +=
            text + "\n";

        logElement.scrollTop =
            logElement.scrollHeight;
    }


    /* ============================================================
       ESTADO
       ============================================================ */

    function setStatus(
        text,
        type = ""
    ) {

        statusElement.textContent =
            text;

        statusElement.className =
            "status";

        if (type) {
            statusElement.classList.add(type);
        }
    }


    /* ============================================================
       LEER PARÁMETROS DE CTRADER
       ============================================================ */

    function readUrlParameters() {

        try {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const platform =
                params.get("platform");


            const symbol =
                params.get("symbol");


            platformElement.textContent =
                platform || "-";


            currentSymbolName =
                symbol || null;


            symbolElement.textContent =
                currentSymbolName || "-";


            log(
                "Plataforma: " +
                (platform || "no indicada")
            );


            log(
                "Símbolo recibido: " +
                (currentSymbolName || "NO RECIBIDO")
            );


        } catch (error) {

            log(
                "Error leyendo parámetros: " +
                String(error)
            );

        }
    }


    /* ============================================================
       NORMALIZAR PRECIO
       ============================================================ */

    function normalizePrice(value) {

        if (value === null ||
            value === undefined) {

            return null;
        }


        let number =
            Number(value);


        if (!Number.isFinite(number)) {

            return null;
        }


        /*
         * cTrader utiliza normalmente
         * precios internos en 1/100000.
         */

        if (Math.abs(number) > 10000) {

            number =
                number / 100000;
        }


        return number;
    }


    /* ============================================================
       MOSTRAR PRECIO
       ============================================================ */

    function formatPrice(value) {

        if (value === null ||
            value === undefined) {

            return "-";
        }


        return Number(value)
            .toFixed(currentSymbolDigits);
    }


    /* ============================================================
       BUSCAR SÍMBOLO
       ============================================================ */

    function loadCurrentSymbol() {

        if (!adapter) {

            log(
                "ERROR: adapter no disponible"
            );

            return;
        }


        if (!currentSymbolName) {

            log(
                "No se recibió nombre de símbolo."
            );

            log(
                "Se intentará obtener información igualmente."
            );

            return;
        }


        log(
            "Buscando símbolo: " +
            currentSymbolName
        );


        getLightSymbolList(
            adapter,
            {}
        )
        .pipe(
            take(1),
            catchError(error => {

                log(
                    "ERROR getLightSymbolList:"
                );

                log(
                    String(error)
                );

                setStatus(
                    "Error obteniendo símbolos",
                    "error"
                );

                return [];

            })
        )
        .subscribe({

            next: (response) => {

                log(
                    "Lista de símbolos recibida"
                );


                const symbols =
                    response?.symbol ||
                    response?.symbols ||
                    [];


                if (!Array.isArray(symbols)) {

                    log(
                        "Formato inesperado de lista de símbolos"
                    );

                    log(
                        JSON.stringify(
                            response
                        )
                    );

                    return;
                }


                log(
                    "Símbolos recibidos: " +
                    symbols.length
                );


                const found =
                    symbols.find(
                        s =>
                            String(s.name)
                            .toUpperCase() ===
                            String(currentSymbolName)
                            .toUpperCase()
                    );


                if (!found) {

                    log(
                        "NO se encontró el símbolo: " +
                        currentSymbolName
                    );

                    /*
                     * Mostramos los primeros símbolos
                     * para poder diagnosticar si cTrader
                     * está devolviendo la lista correctamente.
                     */

                    const sample =
                        symbols
                            .slice(0, 10)
                            .map(s => s.name)
                            .join(", ");


                    log(
                        "Ejemplos recibidos: " +
                        sample
                    );

                    return;
                }


                currentSymbolId =
                    Number(found.symbolId);


                log(
                    "Símbolo encontrado: " +
                    found.name
                );


                log(
                    "Symbol ID: " +
                    currentSymbolId
                );


                loadSymbolDetails();

            }

        });

    }


    /* ============================================================
       OBTENER DETALLES DEL SÍMBOLO
       ============================================================ */

    function loadSymbolDetails() {

        if (!currentSymbolId) {

            log(
                "ERROR: Symbol ID inválido"
            );

            return;
        }


        log(
            "Obteniendo detalles del símbolo..."
        );


        getSymbol(
            adapter,
            {
                symbolId: [
                    currentSymbolId
                ]
            }
        )
        .pipe(
            take(1),
            catchError(error => {

                log(
                    "ERROR getSymbol:"
                );

                log(
                    String(error)
                );

                setStatus(
                    "Error obteniendo símbolo",
                    "error"
                );

                return [];

            })
        )
        .subscribe({

            next: (response) => {

                log(
                    "Detalles del símbolo recibidos"
                );


                const detailedSymbols =
                    response?.symbol ||
                    response?.symbols ||
                    [];


                let symbol = null;


                if (Array.isArray(
                    detailedSymbols
                )) {

                    symbol =
                        detailedSymbols.find(
                            s =>
                                Number(s.symbolId) ===
                                Number(currentSymbolId)
                        );

                } else {

                    symbol =
                        detailedSymbols;
                }


                if (!symbol) {

                    log(
                        "No se pudieron interpretar los detalles del símbolo."
                    );

                    log(
                        JSON.stringify(
                            response
                        )
                    );

                    return;
                }


                log(
                    "Detalles encontrados correctamente"
                );


                /*
                 * Intentamos obtener los dígitos
                 * del símbolo.
                 */

                if (
                    symbol.digits !== undefined
                ) {

                    currentSymbolDigits =
                        Number(symbol.digits);

                } else if (
                    symbol.precision !== undefined
                ) {

                    currentSymbolDigits =
                        Number(symbol.precision);

                }


                /*
                 * Para forex normalmente será 5.
                 */

                if (
                    !Number.isFinite(
                        currentSymbolDigits
                    ) ||
                    currentSymbolDigits < 0 ||
                    currentSymbolDigits > 10
                ) {

                    currentSymbolDigits = 5;
                }


                log(
                    "Decimales: " +
                    currentSymbolDigits
                );


                subscribeToQuotes();

            }

        });

    }


    /* ============================================================
       SUSCRIBIR COTIZACIONES
       ============================================================ */

    function subscribeToQuotes() {

        if (!currentSymbolId) {

            log(
                "ERROR: no hay Symbol ID para las cotizaciones"
            );

            return;
        }


        log(
            "Suscribiendo BID/ASK..."
        );


        try {

            quoteEvent(
                adapter
            )
            .pipe(

                catchError(error => {

                    log(
                        "ERROR quoteEvent:"
                    );

                    log(
                        String(error)
                    );

                    return [];

                })

            )
            .subscribe({

                next: (event) => {

                    processQuote(
                        event
                    );

                },

                error: (error) => {

                    log(
                        "ERROR en stream de cotizaciones:"
                    );

                    log(
                        String(error)
                    );

                }

            });


            /*
             * IMPORTANTE:
             * symbolId es un ARRAY.
             */

            subscribeQuotes(
                adapter,
                {
                    symbolId: [
                        currentSymbolId
                    ]
                }
            )
            .pipe(
                take(1),
                catchError(error => {

                    log(
                        "ERROR subscribeQuotes:"
                    );

                    log(
                        String(error)
                    );

                    return [];

                })
            )
            .subscribe({

                next: () => {

                    log(
                        "Suscripción BID/ASK realizada"
                    );

                    setStatus(
                        "CONECTADO",
                        "connected"
                    );

                    log(
                        "Esperando cotizaciones en tiempo real..."
                    );

                }

            });

        } catch (error) {

            log(
                "ERROR suscribiendo cotizaciones:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error en cotizaciones",
                "error"
            );

        }

    }


    /* ============================================================
       PROCESAR QUOTE
       ============================================================ */

    function processQuote(event) {

        if (!event) {
            return;
        }


        /*
         * Dependiendo de la versión del SDK,
         * el quote puede llegar directamente
         * o dentro de diferentes propiedades.
         */

        const quote =
            event.quote ||
            event;


        const eventSymbolId =
            quote.symbolId !== undefined
                ? Number(quote.symbolId)
                : null;


        /*
         * Si el evento tiene Symbol ID y no
         * corresponde al nuestro, lo ignoramos.
         */

        if (
            eventSymbolId !== null &&
            currentSymbolId !== null &&
            eventSymbolId !== currentSymbolId
        ) {

            return;
        }


        let bid =
            normalizePrice(
                quote.bid
            );


        let ask =
            normalizePrice(
                quote.ask
            );


        /*
         * Algunas respuestas pueden traer
         * bid/ask dentro de otros objetos.
         */

        if (
            bid === null &&
            quote.bidPrice !== undefined
        ) {

            bid =
                normalizePrice(
                    quote.bidPrice
                );
        }


        if (
            ask === null &&
            quote.askPrice !== undefined
        ) {

            ask =
                normalizePrice(
                    quote.askPrice
                );
        }


        if (bid !== null) {

            bidElement.textContent =
                formatPrice(bid);
        }


        if (ask !== null) {

            askElement.textContent =
                formatPrice(ask);
        }

    }


    /* ============================================================
       INICIALIZAR CTRADER
       ============================================================ */

    function initializePlugin() {

        log(
            "Ayalga Quick Trade V0.8 iniciando..."
        );


        readUrlParameters();


        /* --------------------------------------------------------
           1. LOGGER
           -------------------------------------------------------- */

        log(
            "1. Creando logger..."
        );


        const logger =
            createLogger(
                window.location.href.includes(
                    "showLogs"
                )
            );


        /* --------------------------------------------------------
           2. CLIENT ADAPTER
           -------------------------------------------------------- */

        log(
            "2. Creando Client Adapter..."
        );


        try {

            adapter =
                createClientAdapter({
                    logger
                });

        } catch (error) {

            log(
                "ERROR creando Client Adapter:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error creando conexión",
                "error"
            );

            return;
        }


        log(
            "Client Adapter creado correctamente"
        );


        /* --------------------------------------------------------
           3. CONFIRMACIÓN INICIAL
           -------------------------------------------------------- */

        log(
            "3. Enviando confirmación inicial..."
        );


        try {

            handleConfirmEvent(
                adapter,
                {}
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: () => {

                    log(
                        "Confirmación inicial recibida"
                    );

                },

                error: (error) => {

                    log(
                        "Error confirmación inicial:"
                    );

                    log(
                        String(error)
                    );

                }

            });

        } catch (error) {

            log(
                "ERROR confirmación inicial:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error de confirmación",
                "error"
            );

            return;
        }


        /* --------------------------------------------------------
           4. REGISTER EVENT
           -------------------------------------------------------- */

        log(
            "4. Registrando plugin..."
        );


        try {

            registerEvent(
                adapter
            )
            .pipe(

                take(1),

                catchError(error => {

                    log(
                        "ERROR registerEvent:"
                    );

                    log(
                        String(error)
                    );

                    setStatus(
                        "Error de registro",
                        "error"
                    );

                    return [];

                })

            )
            .subscribe({

                next: () => {

                    log(
                        "5. REGISTER EVENT OK"
                    );


                    /* ------------------------------------------------
                       6. SEGUNDA CONFIRMACIÓN
                       ------------------------------------------------ */

                    log(
                        "6. Enviando confirmación final..."
                    );


                    try {

                        handleConfirmEvent(
                            adapter,
                            {}
                        )
                        .pipe(
                            take(1)
                        )
                        .subscribe({

                            error: (error) => {

                                log(
                                    "Error confirmación final:"
                                );

                                log(
                                    String(error)
                                );

                            }

                        });


                        log(
                            "7. Confirmación final enviada"
                        );


                        /* ------------------------------------------------
                           8. CONECTADO
                           ------------------------------------------------ */

                        connected = true;


                        setStatus(
                            "CONECTADO",
                            "connected"
                        );


                        log(
                            "8. CONECTADO CORRECTAMENTE"
                        );


                        /* ------------------------------------------------
                           9. AHORA SÍ BUSCAMOS EL SÍMBOLO
                           ------------------------------------------------ */

                        log(
                            "9. Buscando símbolo actual..."
                        );


                        loadCurrentSymbol();

                    } catch (error) {

                        log(
                            "ERROR confirmación final:"
                        );

                        log(
                            String(error)
                        );

                        setStatus(
                            "Error confirmación final",
                            "error"
                        );

                    }

                },

                error: (error) => {

                    log(
                        "ERROR registerEvent:"
                    );

                    log(
                        String(error)
                    );

                    setStatus(
                        "Error de registro",
                        "error"
                    );

                }

            });

        } catch (error) {

            log(
                "ERROR ejecutando registerEvent:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error de conexión",
                "error"
            );

        }

    }


    /* ============================================================
       ARRANQUE
       ============================================================ */

    window.addEventListener(
        "load",
        () => {

            initializePlugin();

        }
    );

</script>

</body>
</html>
