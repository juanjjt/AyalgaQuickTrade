<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Ayalga Quick Trade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #111111;
            color: #ffffff;
        }

        body {
            padding: 14px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .card {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #333333;
        }

        .label {
            font-size: 12px;
            color: #999999;
            margin-bottom: 4px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
        }

        .symbol {
            font-size: 26px;
            font-weight: bold;
        }

        .prices {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .price-box {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            background: #252525;
            text-align: center;
        }

        .bid {
            color: #4caf50;
        }

        .ask {
            color: #f44336;
        }

        .log {
            background: #090909;
            border-radius: 8px;
            padding: 10px;
            height: 230px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status {
            font-weight: bold;
        }

        .ok {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }

        .waiting {
            color: #ffb300;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        Ayalga Quick Trade
    </div>

    <div class="card">

        <div class="label">
            Símbolo recibido por cTrader
        </div>

        <div id="urlSymbol" class="symbol">
            ---
        </div>

    </div>


    <div class="card">

        <div class="label">
            Símbolo encontrado
        </div>

        <div id="foundSymbol" class="value">
            Buscando...
        </div>

        <div style="margin-top:10px;">

            <div class="label">
                Symbol ID
            </div>

            <div id="symbolId" class="value">
                ---
            </div>

        </div>

    </div>


    <div class="card">

        <div class="label">
            Estado
        </div>

        <div id="status" class="status waiting">
            Inicializando...
        </div>

    </div>


    <div class="card">

        <div class="label">
            Cotización
        </div>

        <div class="prices">

            <div class="price-box">
                <div class="label">
                    BID
                </div>

                <div id="bid" class="value bid">
                    ---
                </div>
            </div>


            <div class="price-box">
                <div class="label">
                    ASK
                </div>

                <div id="ask" class="value ask">
                    ---
                </div>
            </div>

        </div>

    </div>


    <div class="card">

        <div class="label">
            Registro
        </div>

        <div id="log" class="log"></div>

    </div>

</div>


<script type="module">

    import {
        createClientAdapter,
        handleConfirmEvent,
        registerEvent,
        getLightSymbolList,
        getSymbol,
        subscribeQuotes,
        quoteEvent
    } from "https://esm.sh/@spotware-web-team/sdk";


    import {
        take,
        tap,
        catchError
    } from "https://esm.sh/rxjs";


    import {
        createLogger
    } from "https://esm.sh/@veksa/logger";


    // ============================================================
    // ELEMENTOS UI
    // ============================================================

    const urlSymbolElement =
        document.getElementById("urlSymbol");

    const foundSymbolElement =
        document.getElementById("foundSymbol");

    const symbolIdElement =
        document.getElementById("symbolId");

    const statusElement =
        document.getElementById("status");

    const bidElement =
        document.getElementById("bid");

    const askElement =
        document.getElementById("ask");

    const logElement =
        document.getElementById("log");


    // ============================================================
    // VARIABLES
    // ============================================================

    let adapter = null;

    let selectedSymbolName = null;

    let selectedSymbolId = null;


    // ============================================================
    // LOG
    // ============================================================

    function log(message) {

        const time =
            new Date().toLocaleTimeString();

        logElement.textContent +=
            `[${time}] ${message}\n`;

        logElement.scrollTop =
            logElement.scrollHeight;

        console.log(message);
    }


    // ============================================================
    // ESTADO
    // ============================================================

    function setStatus(message, type = "waiting") {

        statusElement.textContent =
            message;

        statusElement.className =
            "status " + type;
    }


    // ============================================================
    // SÍMBOLO DE LA URL
    // ============================================================

    const urlParams =
        new URLSearchParams(window.location.search);


    const symbolFromUrl =
        urlParams.get("symbol");


    if (symbolFromUrl) {

        selectedSymbolName =
            String(symbolFromUrl)
                .trim()
                .toUpperCase();

        urlSymbolElement.textContent =
            selectedSymbolName;

        log(
            `Símbolo recibido desde URL: ${selectedSymbolName}`
        );

    } else {

        urlSymbolElement.textContent =
            "NO RECIBIDO";

        log(
            "No se recibió parámetro symbol en la URL."
        );
    }


    // ============================================================
    // LOGGER
    // ============================================================

    const logger =
        createLogger(
            location.href.includes("showLogs")
        );


    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    async function initialize() {

        try {

            setStatus(
                "Conectando con cTrader...",
                "waiting"
            );

            log(
                "Creando Client Adapter..."
            );


            // ----------------------------------------------------
            // ADAPTER
            // ----------------------------------------------------

            adapter =
                createClientAdapter({
                    logger
                });


            log(
                "Client Adapter creado."
            );


            // ----------------------------------------------------
            // HANDSHAKE
            // ----------------------------------------------------

            log(
                "Esperando confirmación de cTrader..."
            );


            handleConfirmEvent(
                adapter,
                {}
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: () => {

                    log(
                        "Confirmación recibida."
                    );

                },

                error: (error) => {

                    log(
                        "Error en confirmación: " +
                        JSON.stringify(error)
                    );

                }

            });


            // ----------------------------------------------------
            // REGISTER
            // ----------------------------------------------------

            log(
                "Registrando plugin..."
            );


            registerEvent(
                adapter
            )
            .pipe(
                take(1),

                tap(() => {

                    log(
                        "Plugin registrado correctamente."
                    );


                    // Segundo confirm oficial
                    handleConfirmEvent(
                        adapter,
                        {}
                    )
                    .pipe(
                        take(1)
                    )
                    .subscribe({

                        next: () => {

                            log(
                                "Handshake completado."
                            );

                        },

                        error: (error) => {

                            log(
                                "Error en segundo handshake: " +
                                JSON.stringify(error)
                            );

                        }

                    });


                    setStatus(
                        "Conectado",
                        "ok"
                    );


                    // Continuamos buscando el símbolo
                    loadSymbols();

                }),

                catchError(error => {

                    log(
                        "ERROR registrando plugin: " +
                        JSON.stringify(error)
                    );

                    setStatus(
                        "Error registrando plugin",
                        "error"
                    );

                    return [];

                })

            )
            .subscribe();

        }

        catch (error) {

            console.error(error);

            log(
                "ERROR INICIALIZANDO: " +
                JSON.stringify(error)
            );

            setStatus(
                "Error inicializando",
                "error"
            );
        }
    }


    // ============================================================
    // OBTENER LISTA DE SÍMBOLOS
    // ============================================================

    function loadSymbols() {

        if (!adapter) {

            log(
                "ERROR: adapter no disponible."
            );

            return;
        }


        setStatus(
            "Buscando símbolo...",
            "waiting"
        );


        log(
            "Solicitando lista de símbolos..."
        );


        getLightSymbolList(
            adapter,
            {}
        )
        .pipe(
            take(1)
        )
        .subscribe({

            next: response => {

                log(
                    "Respuesta getLightSymbolList recibida."
                );


                // ------------------------------------------------
                // MOSTRAR ESTRUCTURA PRINCIPAL
                // ------------------------------------------------

                try {

                    log(
                        "Keys respuesta: " +
                        Object.keys(response || {}).join(", ")
                    );

                } catch (e) {

                    log(
                        "No se pudieron leer las keys."
                    );
                }


                // ------------------------------------------------
                // AQUÍ ESTABA EL ERROR
                //
                // La respuesta real es:
                //
                // response.payload.Symbol
                // ------------------------------------------------

                const symbols =
                    response?.payload?.Symbol || [];


                log(
                    `Cantidad de símbolos recibidos: ${symbols.length}`
                );


                if (!symbols.length) {

                    log(
                        "ERROR: response.payload.Symbol está vacío."
                    );


                    // Mostramos parte de la respuesta
                    try {

                        log(
                            "Respuesta completa: " +
                            JSON.stringify(
                                response,
                                null,
                                2
                            )
                        );

                    } catch (e) {}

                    setStatus(
                        "No se recibieron símbolos",
                        "error"
                    );

                    return;
                }


                // ------------------------------------------------
                // BUSCAR EL SÍMBOLO
                // ------------------------------------------------

                let targetSymbol =
                    null;


                if (selectedSymbolName) {

                    targetSymbol =
                        symbols.find(symbol => {

                            const name =
                                String(
                                    symbol?.Name ?? ""
                                )
                                .trim()
                                .toUpperCase();

                            return (
                                name ===
                                selectedSymbolName
                            );

                        });

                }


                // ------------------------------------------------
                // SI NO VIENE SYMBOL DE URL
                // ------------------------------------------------

                if (!targetSymbol) {

                    log(
                        "No se encontró el símbolo solicitado."
                    );


                    if (!selectedSymbolName) {

                        log(
                            "No hay symbol en la URL."
                        );

                    } else {

                        log(
                            `Buscado: ${selectedSymbolName}`
                        );
                    }


                    // Mostrar primeros símbolos para diagnóstico

                    try {

                        const preview =
                            symbols
                                .slice(0, 10)
                                .map(s =>
                                    `${s?.Id} = ${s?.Name}`
                                )
                                .join(" | ");


                        log(
                            "Primeros símbolos: " +
                            preview
                        );

                    } catch (e) {}


                    setStatus(
                        "Símbolo no encontrado",
                        "error"
                    );

                    foundSymbolElement.textContent =
                        "NO ENCONTRADO";

                    return;
                }


                // ------------------------------------------------
                // SÍMBOLO ENCONTRADO
                // ------------------------------------------------

                selectedSymbolId =
                    targetSymbol.Id;


                selectedSymbolName =
                    String(
                        targetSymbol.Name
                    );


                foundSymbolElement.textContent =
                    selectedSymbolName;


                symbolIdElement.textContent =
                    selectedSymbolId;


                urlSymbolElement.textContent =
                    selectedSymbolName;


                log(
                    `Símbolo encontrado: ${selectedSymbolName}`
                );


                log(
                    `Symbol ID: ${selectedSymbolId}`
                );


                log(
                    "Información completa del símbolo:"
                );


                try {

                    log(
                        JSON.stringify(
                            targetSymbol,
                            null,
                            2
                        )
                    );

                } catch (e) {}


                setStatus(
                    "Símbolo encontrado",
                    "ok"
                );


                // ------------------------------------------------
                // SIGUIENTE PASO
                // ------------------------------------------------

                loadSymbolDetails();

            },

            error: error => {

                log(
                    "ERROR getLightSymbolList: " +
                    JSON.stringify(error)
                );


                setStatus(
                    "Error obteniendo símbolos",
                    "error"
                );

            }

        });

    }


    // ============================================================
    // OBTENER INFORMACIÓN DEL SÍMBOLO
    // ============================================================

    function loadSymbolDetails() {

        if (
            !adapter ||
            selectedSymbolId === null
        ) {

            log(
                "No se puede obtener información del símbolo."
            );

            return;
        }


        log(
            `Solicitando información del símbolo ID ${selectedSymbolId}...`
        );


        getSymbol(
            adapter,
            {
                symbolId: [
                    selectedSymbolId
                ]
            }
        )
        .pipe(
            take(1)
        )
        .subscribe({

            next: response => {

                log(
                    "Respuesta getSymbol recibida."
                );


                try {

                    log(
                        JSON.stringify(
                            response,
                            null,
                            2
                        )
                    );

                } catch (e) {}


                setStatus(
                    "Símbolo listo",
                    "ok"
                );


                // Continuamos con las cotizaciones
                startQuotes();

            },

            error: error => {

                log(
                    "ERROR getSymbol: " +
                    JSON.stringify(error)
                );


                // Aunque falle getSymbol,
                // intentamos cotizaciones
                startQuotes();

            }

        });

    }


    // ============================================================
    // SUSCRIPCIÓN A COTIZACIONES
    // ============================================================

    function startQuotes() {

        if (
            !adapter ||
            selectedSymbolId === null
        ) {

            log(
                "No se puede iniciar cotizaciones."
            );

            return;
        }


        log(
            `Suscribiendo cotizaciones para ID ${selectedSymbolId}...`
        );


        subscribeQuotes(
            adapter,
            {
                symbolId: [
                    selectedSymbolId
                ]
            }
        )
        .pipe(
            take(1)
        )
        .subscribe({

            next: response => {

                log(
                    "Suscripción a cotizaciones confirmada."
                );


                try {

                    log(
                        JSON.stringify(
                            response,
                            null,
                            2
                        )
                    );

                } catch (e) {}


                setStatus(
                    "Cotizaciones activas",
                    "ok"
                );


                listenQuotes();

            },

            error: error => {

                log(
                    "ERROR subscribeQuotes: " +
                    JSON.stringify(error)
                );


                setStatus(
                    "Error en cotizaciones",
                    "error"
                );

            }

        });

    }


    // ============================================================
    // ESCUCHAR QUOTES
    // ============================================================

    function listenQuotes() {

        log(
            "Escuchando quoteEvent..."
        );


        quoteEvent(
            adapter
        )
        .subscribe({

            next: event => {

                try {

                    // Mostrar únicamente eventos
                    // correspondientes al símbolo seleccionado

                    const payload =
                        event?.payload ||
                        event;


                    // ------------------------------------------------
                    // DIAGNÓSTICO
                    // ------------------------------------------------

                    console.log(
                        "QUOTE EVENT:",
                        event
                    );


                    // ------------------------------------------------
                    // INTENTAR OBTENER BID / ASK
                    // ------------------------------------------------

                    let bid = null;
                    let ask = null;


                    // Posibles estructuras
                    // del evento SDK

                    if (
                        payload &&
                        Array.isArray(
                            payload.quote
                        )
                    ) {

                        const quote =
                            payload.quote.find(
                                q =>
                                    Number(q.SymbolId) ===
                                    Number(selectedSymbolId)
                            );


                        if (quote) {

                            bid =
                                quote.Bid;

                            ask =
                                quote.Ask;
                        }
                    }


                    // ------------------------------------------------
                    // OTRA POSIBLE ESTRUCTURA
                    // ------------------------------------------------

                    if (
                        bid === null &&
                        payload?.Bid !== undefined
                    ) {

                        bid =
                            payload.Bid;

                    }


                    if (
                        ask === null &&
                        payload?.Ask !== undefined
                    ) {

                        ask =
                            payload.Ask;

                    }


                    // ------------------------------------------------
                    // OTRA ESTRUCTURA
                    // ------------------------------------------------

                    if (
                        bid === null &&
                        payload?.bid !== undefined
                    ) {

                        bid =
                            payload.bid;

                    }


                    if (
                        ask === null &&
                        payload?.ask !== undefined
                    ) {

                        ask =
                            payload.ask;

                    }


                    // ------------------------------------------------
                    // MOSTRAR BID
                    // ------------------------------------------------

                    if (bid !== null) {

                        bidElement.textContent =
                            formatPrice(bid);

                    }


                    // ------------------------------------------------
                    // MOSTRAR ASK
                    // ------------------------------------------------

                    if (ask !== null) {

                        askElement.textContent =
                            formatPrice(ask);

                    }


                } catch (error) {

                    console.error(
                        "Error procesando quote:",
                        error
                    );

                }

            },

            error: error => {

                log(
                    "ERROR quoteEvent: " +
                    JSON.stringify(error)
                );


                setStatus(
                    "Error escuchando cotizaciones",
                    "error"
                );

            }

        });

    }


    // ============================================================
    // FORMATEAR PRECIO
    // ============================================================

    function formatPrice(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "---";
        }


        const number =
            Number(value);


        if (
            !Number.isFinite(number)
        ) {

            return String(value);
        }


        // --------------------------------------------------------
        // cTrader puede enviar precios en formato interno
        // 1/100000.
        //
        // Para valores grandes, intentamos detectar dicho formato.
        // --------------------------------------------------------

        let price =
            number;


        if (
            Math.abs(number) > 1000
        ) {

            price =
                number / 100000;

        }


        return price.toFixed(5);

    }


    // ============================================================
    // INICIAR
    // ============================================================

    initialize();

</script>

</body>
</html>
