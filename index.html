<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Ayalga Quick Trade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111111;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 18px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 700;
        }

        .status {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: #252525;
            color: #f0c933;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .status.connected {
            color: #39d353;
        }

        .status.error {
            color: #ff4d4d;
        }

        .info {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: #1d1d1d;
            margin-bottom: 18px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #999999;
            font-size: 15px;
        }

        .value {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }

        .log-title {
            color: #999999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .log {
            width: 100%;
            min-height: 260px;
            padding: 14px;
            border-radius: 10px;
            background: #050505;
            color: #eeeeee;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ayalga Quick Trade</h1>

    <div id="status" class="status">
        Inicializando...
    </div>

    <div class="info">

        <div class="info-row">
            <span class="label">Versión</span>
            <span class="value">V0.7</span>
        </div>

        <div class="info-row">
            <span class="label">Plugin</span>
            <span class="value">AyalgaQuickTrade</span>
        </div>

        <div class="info-row">
            <span class="label">Plataforma</span>
            <span id="platform" class="value">-</span>
        </div>

        <div class="info-row">
            <span class="label">Símbolo recibido</span>
            <span id="symbol" class="value">-</span>
        </div>

    </div>

    <div class="log-title">
        Registro de conexión
    </div>

    <div id="log" class="log"></div>

</div>


<script type="module">

    /* ============================================================
       IMPORTS OFICIALES DEL SDK DE CTRADER
       ============================================================ */

    import {
        createClientAdapter
    } from "https://esm.sh/@spotware-web-team/sdk-external-api";


    import {
        handleConfirmEvent,
        registerEvent
    } from "https://esm.sh/@spotware-web-team/sdk";


    import {
        take,
        tap,
        catchError
    } from "https://esm.sh/rxjs";


    import {
        createLogger
    } from "https://esm.sh/@veksa/logger";


    /* ============================================================
       VARIABLES
       ============================================================ */

    let adapter = null;
    let connected = false;


    /* ============================================================
       ELEMENTOS HTML
       ============================================================ */

    const statusElement =
        document.getElementById("status");

    const logElement =
        document.getElementById("log");

    const platformElement =
        document.getElementById("platform");

    const symbolElement =
        document.getElementById("symbol");


    /* ============================================================
       LOG
       ============================================================ */

    function getTime() {

        const now = new Date();

        return now.toLocaleTimeString(
            "es-ES",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );
    }


    function log(message) {

        const line =
            "[" + getTime() + "] " + message;

        console.log(line);

        logElement.textContent +=
            line + "\n";

        logElement.scrollTop =
            logElement.scrollHeight;
    }


    /* ============================================================
       ESTADO
       ============================================================ */

    function setStatus(
        text,
        type = ""
    ) {

        statusElement.textContent =
            text;

        statusElement.className =
            "status";

        if (type) {
            statusElement.classList.add(type);
        }
    }


    /* ============================================================
       INFORMACIÓN DE LA URL
       ============================================================ */

    function readUrlInformation() {

        try {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const platform =
                params.get("platform");

            const symbol =
                params.get("symbol");


            platformElement.textContent =
                platform || "-";


            symbolElement.textContent =
                symbol || "-";


            log(
                "URL del plugin: " +
                window.location.href
            );


            log(
                "Plataforma: " +
                (platform || "no indicada")
            );


            log(
                "Símbolo: " +
                (symbol || "no indicado")
            );

        } catch (error) {

            log(
                "Error leyendo parámetros URL: " +
                String(error)
            );

        }
    }


    /* ============================================================
       INICIALIZACIÓN
       ============================================================ */

    function initializePlugin() {

        log(
            "Ayalga Quick Trade V0.7 iniciando"
        );


        readUrlInformation();


        /* --------------------------------------------------------
           1. LOGGER
           -------------------------------------------------------- */

        log(
            "1. Creando logger..."
        );

        const logger =
            createLogger(
                window.location.href.includes(
                    "showLogs"
                )
            );


        /* --------------------------------------------------------
           2. CLIENT ADAPTER
           -------------------------------------------------------- */

        log(
            "2. Creando Client Adapter..."
        );

        try {

            adapter =
                createClientAdapter({
                    logger
                });

        } catch (error) {

            log(
                "ERROR creando Client Adapter:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error creando conexión",
                "error"
            );

            return;
        }


        log(
            "Client Adapter creado correctamente"
        );


        /* --------------------------------------------------------
           3. CONFIRMACIÓN INICIAL
           -------------------------------------------------------- */

        log(
            "3. Enviando confirmación inicial..."
        );


        try {

            handleConfirmEvent(
                adapter,
                {}
            )
            .pipe(
                take(1)
            )
            .subscribe({

                next: () => {

                    log(
                        "Confirmación inicial recibida"
                    );

                },

                error: (error) => {

                    log(
                        "Error en confirmación inicial:"
                    );

                    log(
                        String(error)
                    );

                }

            });

        } catch (error) {

            log(
                "ERROR enviando confirmación inicial:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error en confirmación",
                "error"
            );

            return;
        }


        /* --------------------------------------------------------
           4. REGISTRAR PLUGIN
           -------------------------------------------------------- */

        log(
            "4. Registrando plugin en cTrader..."
        );


        try {

            registerEvent(
                adapter
            )
            .pipe(

                take(1),

                tap(() => {

                    /* ------------------------------------------------
                       5. REGISTER EVENT OK
                       ------------------------------------------------ */

                    log(
                        "5. REGISTER EVENT OK"
                    );


                    /* ------------------------------------------------
                       6. SEGUNDA CONFIRMACIÓN
                       
                       IMPORTANTE:
                       NO esperamos a que este Observable termine.
                       Es exactamente el patrón utilizado por
                       la documentación oficial de cTrader.
                       ------------------------------------------------ */

                    log(
                        "6. Enviando confirmación final..."
                    );


                    try {

                        handleConfirmEvent(
                            adapter,
                            {}
                        )
                        .pipe(
                            take(1)
                        )
                        .subscribe({

                            error: (error) => {

                                log(
                                    "Error en confirmación final:"
                                );

                                log(
                                    String(error)
                                );

                            }

                        });


                        /*
                         * La segunda confirmación se envía.
                         *
                         * NO esperamos una respuesta aquí.
                         * El handshake queda completado según
                         * el patrón oficial del SDK.
                         */

                        log(
                            "7. Confirmación final enviada"
                        );


                        /* ------------------------------------------------
                           8. CONECTADO
                           ------------------------------------------------ */

                        connected = true;


                        setStatus(
                            "CONECTADO",
                            "connected"
                        );


                        log(
                            "8. CONECTADO CORRECTAMENTE"
                        );


                        log(
                            "El plugin ya está conectado a cTrader."
                        );


                    } catch (error) {

                        log(
                            "ERROR enviando confirmación final:"
                        );

                        log(
                            String(error)
                        );

                        setStatus(
                            "Error en confirmación final",
                            "error"
                        );

                    }

                }),

                catchError((error) => {

                    log(
                        "ERROR registrando plugin:"
                    );

                    log(
                        String(error)
                    );


                    setStatus(
                        "Error de conexión",
                        "error"
                    );


                    return [];

                })

            )
            .subscribe({

                error: (error) => {

                    log(
                        "ERROR inesperado en registerEvent:"
                    );

                    log(
                        String(error)
                    );

                    setStatus(
                        "Error de conexión",
                        "error"
                    );

                }

            });

        } catch (error) {

            log(
                "ERROR ejecutando registerEvent:"
            );

            log(
                String(error)
            );

            setStatus(
                "Error de conexión",
                "error"
            );

        }

    }


    /* ============================================================
       ARRANQUE
       ============================================================ */

    window.addEventListener(
        "load",
        () => {

            initializePlugin();

        }
    );


</script>

</body>
</html>
